<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cursore Aria - Sistema Integrato</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }
        
        .test-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .test-canvas {
            width: 600px;
            height: 400px;
            background: #333;
            border: 2px solid #666;
            cursor: inherit;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover {
            background: #45a049;
        }
        
        .status {
            margin-top: 20px;
            padding: 10px;
            background: #2d2d2d;
            border-radius: 4px;
        }
        
        .tools-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tool-icon {
            width: 50px;
            height: 50px;
            border: 2px solid #666;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: #444;
        }
        
        .tool-icon.active {
            border-color: #4CAF50;
            background: #5CAF60;
        }
        
        .tool-icon img {
            width: 32px;
            height: 32px;
        }
    </style>
</head>
<body>
    <h1>Test Sistema Cursore Aria - Integrazione Completa</h1>
    
    <!-- Strumenti (simulazione) -->
    <div class="tools-container" id="toolsContainer">
        <!-- Sarà popolato da ToolsManager -->
    </div>
    
    <div class="test-container">
        <canvas class="test-canvas" id="canvas3d"></canvas>
        
        <div class="controls">
            <button onclick="testAriaActivation()">Attiva Tool Aria</button>
            <button onclick="testAriaDeactivation()">Disattiva Tool Aria</button>
            <button onclick="testAllTools()">Test Tutti gli Strumenti</button>
            <button onclick="checkCursorStatus()">Stato Cursore</button>
            <button onclick="simulateMousePress()">Simula Mouse Premuto</button>
            <button onclick="simulateMouseRelease()">Simula Mouse Rilasciato</button>
        </div>
    </div>
    
    <div class="status" id="status">
        Status: Caricamento...
    </div>

    <!-- Carica i moduli necessari -->
    <script src="js/ui/ToolsManager.js"></script>
    
    <script>
        // Simulazione FeedbackManager
        const mockFeedbackManager = {
            updateStatus: function(message) {
                document.getElementById('status').innerHTML = `Status: ${message}`;
                console.log('📢 FeedbackManager:', message);
            }
        };
        
        // Inizializzazione
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🔄 Inizializzazione test cursore...');
            
            // Inizializza ToolsManager
            ToolsManager.init(mockFeedbackManager);
            
            // Listener per eventi tool
            document.addEventListener('toolStateChanged', function(event) {
                console.log('🛠️ Tool cambiato:', event.detail);
                updateStatus(`Tool ${event.detail.toolName}: ${event.detail.isActive ? 'ATTIVO' : 'INATTIVO'}`);
            });
            
            updateStatus('Sistema inizializzato');
        });
        
        function testAriaActivation() {
            console.log('🧪 Test attivazione aria...');
            ToolsManager.activateTool('aria');
        }
        
        function testAriaDeactivation() {
            console.log('🧪 Test disattivazione aria...');
            ToolsManager.deactivateTool('aria');
        }
        
        function testAllTools() {
            const tools = ['brugola', 'chiave_inglese', 'mano', 'aria'];
            let index = 0;
            
            function activateNext() {
                if (index < tools.length) {
                    console.log(`🧪 Test tool ${tools[index]}...`);
                    ToolsManager.activateTool(tools[index]);
                    index++;
                    setTimeout(activateNext, 2000);
                } else {
                    console.log('🧪 Test completato');
                    ToolsManager.deactivateAllTools();
                }
            }
            
            activateNext();
        }
        
        function checkCursorStatus() {
            const bodyClasses = Array.from(document.body.classList);
            const canvasClasses = Array.from(document.querySelector('#canvas3d').classList);
            const activeTool = ToolsManager.getActiveTool();
            
            console.log('🖱️ Stato cursore:');
            console.log('- Tool attivo:', activeTool);
            console.log('- Body classes:', bodyClasses);
            console.log('- Canvas classes:', canvasClasses);
            console.log('- Body computed cursor:', getComputedStyle(document.body).cursor);
            
            updateStatus(`Tool: ${activeTool || 'nessuno'} | Body: ${bodyClasses.join(', ')} | Canvas: ${canvasClasses.join(', ')}`);
        }
        
        function simulateMousePress() {
            console.log('🖱️ Simula mouse premuto...');
            document.body.classList.add('mouse-pressed');
            setTimeout(() => {
                document.body.classList.remove('mouse-pressed');
                console.log('🖱️ Mouse rilasciato automaticamente');
            }, 1000);
        }
        
        function simulateMouseRelease() {
            console.log('🖱️ Mouse rilasciato manualmente...');
            document.body.classList.remove('mouse-pressed');
        }
        
        function updateStatus(message) {
            document.getElementById('status').innerHTML = `Status: ${message}`;
        }
        
        // Test automatico al caricamento
        setTimeout(() => {
            console.log('🚀 Test automatico iniziato...');
            testAriaActivation();
            
            setTimeout(() => {
                checkCursorStatus();
            }, 500);
        }, 1000);
    </script>
</body>
</html>
