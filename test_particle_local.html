<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sistema Particellare - Versione Locale</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #canvas3d {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 8px;
            z-index: 1000;
            max-width: 300px;
        }
        
        .tools {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        
        .tool-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 10px;
            text-align: center;
            line-height: 1.2;
        }
        
        .tool-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #666;
        }
        
        .tool-icon.active {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
        }
        
        /* Stili specifici per icona aria */
        .air-tool-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .air-tool-icon svg {
            color: #aaa;
            transition: all 0.3s ease;
        }
        
        .tool-icon:hover .air-tool-icon svg {
            color: #ddd;
        }
        
        .tool-icon.active .air-tool-icon svg {
            color: #4CAF50;
        }
        
        /* Animazione del getto aria quando attivo */
        .tool-icon.active .air-jet {
            animation: airFlow 1.5s infinite ease-in-out;
        }
        
        @keyframes airFlow {
            0%, 100% {
                opacity: 1;
                transform: translateX(0);
            }
            50% {
                opacity: 0.6;
                transform: translateX(2px);
            }
        }
        
        /* Animazione particelle */
        .tool-icon.active .air-jet circle {
            animation: particles 2s infinite ease-in-out;
        }
        
        .tool-icon.active .air-jet circle:nth-child(4) { animation-delay: 0s; }
        .tool-icon.active .air-jet circle:nth-child(5) { animation-delay: 0.3s; }
        .tool-icon.active .air-jet circle:nth-child(6) { animation-delay: 0.6s; }
        
        @keyframes particles {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            50% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(0.5) translateX(3px);
            }
        }
        
        /* Cursori personalizzati per tool Aria - I tuoi file SVG */
        
        /* Cursore stato normale (mouse non premuto) */
        body.tool-aria-active {
            cursor: url("cursors/pistola_normale.svg") 3 3, auto !important;
        }
        
        /* Cursore stato premuto (mousedown) */
        body.tool-aria-active:active,
        body.tool-aria-active.mouse-pressed {
            cursor: url("cursors/pistola_premuto.svg") 3 3, auto !important;
        }
        
        body.tool-aria-active * {
            cursor: inherit !important;
        }
        
        /* Canvas específico para aria tool */
        body.tool-aria-active #canvas3d {
            cursor: inherit !important;
        }
        
        .test-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .test-button:hover {
            background: #45a049;
        }
        
        .stats {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
        
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-size: 14px;
        }
        
        .status.loading {
            background: #ff9800;
            color: white;
        }
        
        .status.error {
            background: #f44336;
            color: white;
        }
        
        .status.success {
            background: #4CAF50;
            color: white;
        }
    </style>
</head>

<body>
    <canvas id="canvas3d"></canvas>
    
    <div class="controls">
        <h3>🧪 Test Sistema Particellare</h3>
        
        <div class="status loading" id="loadingStatus">
            🔄 Caricamento Three.js...
        </div>
        
        <p><strong>Istruzioni:</strong><br>
        1. Attendi caricamento librerie<br>
        2. Clicca tool "💨 ARIA"<br>
        3. Clicca oggetti per getto aria</p>
        
        <button class="test-button" onclick="testAirJet()" id="testBtn" disabled>
            💨 Test Automatico
        </button>
        <button class="test-button" onclick="clearEffects()" id="clearBtn" disabled>
            🧹 Pulisci
        </button>
        
        <div class="stats" id="stats">Caricamento in corso...</div>
    </div>
    
    <div class="tools" id="toolsContainer" style="display: none;">
        <div class="tool-icon" data-tool="brugola" onclick="selectTool('brugola')">
            🔧<br>BRUGOLA
        </div>
        <div class="tool-icon" data-tool="chiave" onclick="selectTool('chiave')">
            🔩<br>CHIAVE
        </div>
        <div class="tool-icon" data-tool="mano" onclick="selectTool('mano')">
            ✋<br>MANO
        </div>
        <div class="tool-icon" data-tool="aria" onclick="selectTool('aria')">
            <div class="air-tool-icon">
                <svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
                    <!-- Corpo pistola aria -->
                    <path d="M8 18 L28 18 L30 15 L32 15 L32 25 L30 25 L28 22 L8 22 Z" 
                          fill="currentColor" stroke="currentColor" stroke-width="1"/>
                    
                    <!-- Impugnatura -->
                    <path d="M8 18 L8 28 L12 30 L16 28 L16 22" 
                          fill="currentColor" stroke="currentColor" stroke-width="1"/>
                    
                    <!-- Trigger -->
                    <path d="M12 22 L12 26 L14 26 L14 22" 
                          fill="currentColor" stroke="currentColor" stroke-width="1"/>
                    
                    <!-- Getto aria (linee dinamiche) -->
                    <g class="air-jet">
                        <path d="M32 17 L36 15" stroke="currentColor" stroke-width="2" opacity="0.8"/>
                        <path d="M32 20 L37 20" stroke="currentColor" stroke-width="2" opacity="0.6"/>
                        <path d="M32 23 L36 25" stroke="currentColor" stroke-width="2" opacity="0.8"/>
                        
                        <!-- Particelle -->
                        <circle cx="35" cy="16" r="0.5" fill="currentColor" opacity="0.4"/>
                        <circle cx="37" cy="19" r="0.5" fill="currentColor" opacity="0.6"/>
                        <circle cx="36" cy="24" r="0.5" fill="currentColor" opacity="0.4"/>
                    </g>
                </svg>
            </div>
            <span style="font-size: 9px; margin-top: 2px;">ARIA</span>
        </div>
    </div>

    <script>
        // Variabili globali
        let scene, camera, renderer, canvas;
        let particleSystem;
        let activeTool = null;
        let models = [];
        let isReady = false;
        
        // Status elements
        const loadingStatus = document.getElementById('loadingStatus');
        const stats = document.getElementById('stats');
        const toolsContainer = document.getElementById('toolsContainer');
        const testBtn = document.getElementById('testBtn');
        const clearBtn = document.getElementById('clearBtn');
        
        function updateStatus(message, type = 'loading') {
            loadingStatus.textContent = message;
            loadingStatus.className = `status ${type}`;
        }
        
        // Caricamento sequenziale delle librerie
        function startLoading() {
            updateStatus('🔄 Caricamento Three.js...', 'loading');
            
            // Lista CDN da provare
            const cdnList = [
                'https://unpkg.com/three@0.155.0/build/three.min.js',
                'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js',
                'https://cdnjs.cloudflare.com/ajax/libs/three.js/r155/three.min.js'
            ];
            
            tryLoadThreeJS(cdnList, 0);
        }
        
        function tryLoadThreeJS(cdnList, index) {
            if (index >= cdnList.length) {
                updateStatus('❌ Three.js non disponibile', 'error');
                stats.innerHTML = '❌ Impossibile caricare Three.js da nessun CDN';
                return;
            }
            
            const script = document.createElement('script');
            script.src = cdnList[index];
            script.onload = () => {
                console.log(`✅ Three.js caricato da: ${cdnList[index]}`);
                updateStatus('✅ Three.js caricato', 'success');
                setTimeout(() => loadParticleSystem(), 500);
            };
            script.onerror = () => {
                console.warn(`❌ Fallito: ${cdnList[index]}`);
                tryLoadThreeJS(cdnList, index + 1);
            };
            document.head.appendChild(script);
        }
        
        function loadParticleSystem() {
            updateStatus('🔄 Caricamento sistema particellare...', 'loading');
            
            const script = document.createElement('script');
            script.src = 'js/core/ParticleSystem.js';
            script.onload = () => {
                console.log('✅ ParticleSystem caricato');
                updateStatus('✅ Sistema pronto!', 'success');
                setTimeout(() => {
                    initializeSystem();
                }, 1000);
            };
            script.onerror = () => {
                updateStatus('❌ Sistema particellare non disponibile', 'error');
                console.error('❌ Errore caricamento ParticleSystem.js');
                // Continuiamo senza sistema particellare
                setTimeout(() => {
                    initializeSystem();
                }, 1000);
            };
            document.head.appendChild(script);
        }
        
        function initializeSystem() {
            try {
                updateStatus('🚀 Inizializzazione...', 'loading');
                
                // Verifica Three.js
                if (typeof THREE === 'undefined') {
                    throw new Error('THREE.js non disponibile');
                }
                
                init();
                
                // Mostra interfaccia
                loadingStatus.style.display = 'none';
                toolsContainer.style.display = 'flex';
                testBtn.disabled = false;
                clearBtn.disabled = false;
                
                isReady = true;
                console.log('✅ Sistema completamente inizializzato');
                
            } catch (error) {
                updateStatus(`❌ Errore: ${error.message}`, 'error');
                console.error('❌ Errore inizializzazione:', error);
            }
        }
        
        function init() {
            console.log('🚀 Inizializzazione 3D...');
            
            // Setup canvas
            canvas = document.getElementById('canvas3d');
            
            // Setup Three.js
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            // Camera
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
            camera.position.set(4, 2, 4);
            camera.lookAt(0, 0.5, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas,
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            // Luci
            const ambientLight = new THREE.AmbientLight(0x404040, 1.2);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(10, 10, 10);
            scene.add(directionalLight);
            
            // Modelli di test
            addTestModels();
            
            // Inizializza sistema particellare se disponibile
            if (window.ParticleSystem) {
                particleSystem = window.ParticleSystem.init(scene, camera);
                console.log('✅ ParticleSystem inizializzato');
            } else {
                console.warn('⚠️ ParticleSystem non disponibile');
            }
            
            // Setup controlli
            setupControls();
            
            // Avvia rendering
            animate();
            
            // Statistiche
            setInterval(updateStats, 500);
            
            console.log('📊 Scena:', {
                children: scene.children.length,
                models: models.length,
                camera: camera.position,
                hasParticles: !!particleSystem
            });
        }
        
        function addTestModels() {
            // Cubo verde luminoso
            const cubeGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const cubeMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x00ff00,
                emissive: 0x004400
            });
            const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            cube.position.set(-1.8, 0.6, 0);
            cube.userData.name = 'cubo';
            scene.add(cube);
            models.push(cube);
            
            // Sfera blu luminosa
            const sphereGeometry = new THREE.SphereGeometry(0.9, 32, 32);
            const sphereMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x0088ff,
                emissive: 0x001144
            });
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.position.set(1.8, 0.9, 0);
            sphere.userData.name = 'sfera';
            scene.add(sphere);
            models.push(sphere);
            
            // Piano
            const planeGeometry = new THREE.PlaneGeometry(10, 10);
            const planeMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x666666, 
                side: THREE.DoubleSide 
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -0.1;
            plane.userData.name = 'piano';
            scene.add(plane);
            models.push(plane);
            
            // Griglia e assi per orientamento
            const gridHelper = new THREE.GridHelper(8, 16, 0x444444, 0x222222);
            scene.add(gridHelper);
            
            const axesHelper = new THREE.AxesHelper(2);
            scene.add(axesHelper);
            
            console.log('📦 Modelli creati:', models.length);
        }
        
        function setupControls() {
            let mouseDown = false;
            let mouseX = 0, mouseY = 0;
            
            // Gestione stati cursore per tool Aria
            document.addEventListener('mousedown', (event) => {
                if (activeTool === 'aria') {
                    document.body.classList.add('mouse-pressed');
                }
            });
            
            document.addEventListener('mouseup', (event) => {
                if (activeTool === 'aria') {
                    document.body.classList.remove('mouse-pressed');
                }
            });
            
            canvas.addEventListener('mousedown', (event) => {
                mouseDown = true;
                mouseX = event.clientX;
                mouseY = event.clientY;
            });
            
            canvas.addEventListener('mouseup', (event) => {
                if (mouseDown) {
                    const deltaX = Math.abs(event.clientX - mouseX);
                    const deltaY = Math.abs(event.clientY - mouseY);
                    
                    if (deltaX < 5 && deltaY < 5) {
                        handleClick(event);
                    }
                }
                mouseDown = false;
            });
            
            canvas.addEventListener('mousemove', (event) => {
                if (mouseDown) {
                    const deltaX = (event.clientX - mouseX) * 0.01;
                    const deltaY = (event.clientY - mouseY) * 0.01;
                    
                    const spherical = new THREE.Spherical();
                    spherical.setFromVector3(camera.position);
                    spherical.theta -= deltaX;
                    spherical.phi += deltaY;
                    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                    
                    camera.position.setFromSpherical(spherical);
                    camera.lookAt(0, 0.5, 0);
                    
                    mouseX = event.clientX;
                    mouseY = event.clientY;
                }
            });
        }
        
        function handleClick(event) {
            if (!isReady || activeTool !== 'aria') {
                console.log('ℹ️ Sistema non pronto o tool aria non attivo');
                return;
            }
            
            const rect = canvas.getBoundingClientRect();
            const mouse = new THREE.Vector2();
            mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(models, true);
            
            if (intersects.length > 0) {
                const intersection = intersects[0];
                const point = intersection.point;
                const normal = intersection.face ? intersection.face.normal.clone() : new THREE.Vector3(0, 1, 0);
                const intersectedObject = intersection.object;
                
                // Trova il modello root (parent del mesh intersettato)
                let targetModel = intersectedObject;
                while (targetModel.parent && !models.includes(targetModel)) {
                    targetModel = targetModel.parent;
                }
                
                createParticleEffect(point, normal, targetModel, event);
            }
        }
        
        function createParticleEffect(intersectionPoint, normal, intersectedObject, mouseEvent) {
            if (!particleSystem) {
                console.warn('⚠️ Sistema particellare non disponibile');
                return;
            }
            
            // Calcola posizione cursore in coordinate 3D
            const cursorPosition3D = getCursorPosition3D(mouseEvent);
            
            // Calcola centro del bounding box dell'oggetto
            const objectCenter = getObjectBoundingBoxCenter(intersectedObject);
            
            // Direzione dal cursore verso il centro dell'oggetto
            const jetDirection = new THREE.Vector3()
                .subVectors(objectCenter, cursorPosition3D)
                .normalize();
            
            console.log('💨 Creando getto particellare dal cursore all\'oggetto');
            console.log('  - Cursore 3D:', cursorPosition3D);
            console.log('  - Centro oggetto:', objectCenter);
            console.log('  - Direzione:', jetDirection);
            
            // Crea getto aria dal cursore verso l'oggetto
            particleSystem.createAirJet(cursorPosition3D, jetDirection, {
                particleCount: 400,
                life: 2.0,
                speed: { min: 12, max: 25 },
                size: { min: 0.02, max: 0.08 },
                spread: { x: 0.1, y: 0.1, z: 0.1 } // Getto più concentrato
            });
            
            // Effetto polvere nel punto di impatto
            setTimeout(() => {
                particleSystem.createDustEffect(intersectionPoint, {
                    particleCount: 200,
                    life: 2.5,
                    speed: { min: 2, max: 8 }
                });
            }, 300); // Delay maggiore per effetto realistico
        }
        
        function getCursorPosition3D(mouseEvent) {
            // Proietta la posizione del cursore su un piano a distanza media dalla camera
            const rect = canvas.getBoundingClientRect();
            const mouse = new THREE.Vector2();
            mouse.x = ((mouseEvent.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((mouseEvent.clientY - rect.top) / rect.height) * 2 + 1;
            
            // Crea un punto a distanza fissa dalla camera nella direzione del cursore
            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);
            
            // Posizione cursore proiettata a distanza 2 unità dalla camera
            const cursorDistance = 2.0;
            const cursorPos = raycaster.ray.origin.clone()
                .add(raycaster.ray.direction.multiplyScalar(cursorDistance));
            
            return cursorPos;
        }
        
        function getObjectBoundingBoxCenter(object) {
            // Calcola il bounding box dell'oggetto
            const boundingBox = new THREE.Box3().setFromObject(object);
            const center = boundingBox.getCenter(new THREE.Vector3());
            return center;
        }
        
        function selectTool(toolName) {
            document.querySelectorAll('.tool-icon').forEach(el => {
                el.classList.remove('active');
            });
            
            document.querySelector(`[data-tool="${toolName}"]`).classList.add('active');
            activeTool = toolName;
            
            // Applica cursore personalizzato per tool Aria
            document.body.classList.remove('tool-aria-active');
            if (toolName === 'aria') {
                document.body.classList.add('tool-aria-active');
                console.log('🔧 Tool Aria attivato - cursore personalizzato applicato');
            }
            
            console.log('🔧 Tool selezionato:', toolName);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            if (particleSystem && particleSystem.isActive) {
                particleSystem.update(0.016);
            }
            
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }
        
        function updateStats() {
            if (!isReady) return;
            
            let info = `Sistema: ✅ Attivo<br>Tool: ${activeTool || 'nessuno'}<br>`;
            
            if (particleSystem) {
                const pStats = particleSystem.getStats();
                info += `Effetti: ${pStats.activeEffects}<br>Particelle: ${pStats.totalParticles}`;
            } else {
                info += 'Particelle: Non disponibili';
            }
            
            stats.innerHTML = info;
        }
        
        // Funzioni globali
        window.testAirJet = function() {
            if (particleSystem) {
                const pos = new THREE.Vector3(0, 1, 0);
                const dir = new THREE.Vector3(1, 0.5, 0).normalize();
                particleSystem.createAirJet(pos, dir);
                console.log('🧪 Test automatico eseguito');
            }
        };
        
        window.clearEffects = function() {
            if (particleSystem) {
                particleSystem.clearAllEffects();
                console.log('🧹 Effetti rimossi');
            }
        };
        
        // Gestione resize
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        
        // Avvio
        window.addEventListener('load', startLoading);
        
    </script>
</body>
</html>
