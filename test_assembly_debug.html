<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assembly System Debug Console - Campus Virtual Training</title>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r155/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r155/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/20.0.0/tween.umd.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        body {
            background: #1a1a1a;
            color: #00ff00;
            overflow: hidden;
        }
        
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 60vh 40vh;
            height: 100vh;
            gap: 2px;
        }
        
        .panel {
            background: #0d1117;
            border: 1px solid #30363d;
            overflow: hidden;
        }
        
        .panel-header {
            background: #21262d;
            padding: 8px 12px;
            border-bottom: 1px solid #30363d;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .panel-content {
            height: calc(100% - 32px);
            overflow: auto;
            padding: 12px;
        }
        
        #canvas-panel {
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 100%;
        }
        
        .canvas-overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            padding: 10px;
            border-radius: 4px;
            font-size: 11px;
            line-height: 1.4;
            min-width: 200px;
        }
        
        .console-output {
            height: 100%;
            overflow-y: auto;
            background: #0a0a0a;
            border: 1px solid #333;
            padding: 8px;
        }
        
        .log-line {
            margin-bottom: 2px;
            font-size: 11px;
            line-height: 1.3;
            word-wrap: break-word;
        }
        
        .log-line.info { color: #58a6ff; }
        .log-line.success { color: #3fb950; }
        .log-line.warning { color: #d29922; }
        .log-line.error { color: #f85149; }
        .log-line.debug { color: #8b949e; }
        
        .controls-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        
        .control-btn {
            padding: 6px 10px;
            background: #238636;
            border: 1px solid #2ea043;
            color: white;
            font-size: 10px;
            cursor: pointer;
            border-radius: 3px;
            text-transform: uppercase;
        }
        
        .control-btn:hover {
            background: #2ea043;
        }
        
        .control-btn.danger {
            background: #da3633;
            border-color: #f85149;
        }
        
        .control-btn.danger:hover {
            background: #f85149;
        }
        
        .control-btn.secondary {
            background: #373e47;
            border-color: #444c56;
        }
        
        .control-btn.secondary:hover {
            background: #444c56;
        }
        
        .input-group {
            display: flex;
            margin-bottom: 8px;
            gap: 4px;
        }
        
        .input-group input,
        .input-group select {
            flex: 1;
            padding: 4px 6px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            font-size: 11px;
            font-family: 'Courier New', monospace;
        }
        
        .input-group button {
            padding: 4px 8px;
            background: #1f6feb;
            border: 1px solid #1f6feb;
            color: white;
            font-size: 10px;
            cursor: pointer;
        }
        
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 10px;
        }
        
        .metric {
            background: #161b22;
            padding: 6px;
            border-radius: 3px;
            border-left: 3px solid #238636;
        }
        
        .metric-label {
            color: #8b949e;
            margin-bottom: 2px;
        }
        
        .metric-value {
            color: #58a6ff;
            font-weight: bold;
            font-size: 12px;
        }
        
        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        
        .status-indicator.active { background: #3fb950; }
        .status-indicator.inactive { background: #6e7681; }
        .status-indicator.error { background: #f85149; }
        
        .debug-section {
            margin-bottom: 16px;
            border: 1px solid #30363d;
            border-radius: 4px;
        }
        
        .debug-section-header {
            background: #21262d;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            border-bottom: 1px solid #30363d;
        }
        
        .debug-section-content {
            padding: 10px;
        }
        
        .object-inspector {
            background: #0a0a0a;
            border: 1px solid #30363d;
            padding: 8px;
            height: 120px;
            overflow: auto;
            font-size: 10px;
            white-space: pre-wrap;
        }
        
        .timestamp {
            color: #6e7681;
            font-size: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 3D Scene Panel -->
        <div class="panel" id="canvas-panel">
            <div class="panel-header">
                <span class="status-indicator" id="scene-status"></span>
                3D Scene Viewer
            </div>
            <div id="canvas-container"></div>
            <div class="canvas-overlay" id="scene-overlay">
                <div><strong>Scene Stats</strong></div>
                <div>Objects: <span id="object-count">0</span></div>
                <div>Triangles: <span id="triangle-count">0</span></div>
                <div>FPS: <span id="fps-counter">0</span></div>
                <div>Camera: <span id="camera-pos">0,0,0</span></div>
            </div>
        </div>
        
        <!-- Debug Controls Panel -->
        <div class="panel">
            <div class="panel-header">
                <span class="status-indicator" id="controls-status"></span>
                Debug Controls
            </div>
            <div class="panel-content">
                <div class="debug-section">
                    <div class="debug-section-header">System Control</div>
                    <div class="debug-section-content">
                        <div class="controls-grid">
                            <button class="control-btn" onclick="initSystems()">Init Systems</button>
                            <button class="control-btn danger" onclick="resetSystems()">Reset All</button>
                            <button class="control-btn secondary" onclick="clearLogs()">Clear Logs</button>
                        </div>
                    </div>
                </div>
                
                <div class="debug-section">
                    <div class="debug-section-header">Assembly Testing</div>
                    <div class="debug-section-content">
                        <div class="input-group">
                            <select id="test-config">
                                <option value="">-- Select Test Config --</option>
                                <option value="simple">Simple Test</option>
                                <option value="complex">Complex Assembly</option>
                                <option value="interchangeable">Interchangeable Nodes</option>
                            </select>
                            <button onclick="loadTestConfig()">Load</button>
                        </div>
                        
                        <div class="controls-grid">
                            <button class="control-btn" onclick="enableAssembly()">Enable</button>
                            <button class="control-btn" onclick="disableAssembly()">Disable</button>
                            <button class="control-btn secondary" onclick="stepForward()">Step +</button>
                        </div>
                        
                        <div class="controls-grid">
                            <button class="control-btn" onclick="undoAction()">Undo</button>
                            <button class="control-btn" onclick="redoAction()">Redo</button>
                            <button class="control-btn secondary" onclick="validateState()">Validate</button>
                        </div>
                    </div>
                </div>
                
                <div class="debug-section">
                    <div class="debug-section-header">Component Inspector</div>
                    <div class="debug-section-content">
                        <div class="input-group">
                            <input type="text" id="component-name" placeholder="Component name">
                            <button onclick="inspectComponent()">Inspect</button>
                        </div>
                        
                        <div class="object-inspector" id="component-data">
                            No component selected
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- System Metrics Panel -->
        <div class="panel">
            <div class="panel-header">
                <span class="status-indicator" id="metrics-status"></span>
                System Metrics
            </div>
            <div class="panel-content">
                <div class="metrics-grid" id="metrics-container">
                    <!-- Metrics will be populated here -->
                </div>
            </div>
        </div>
        
        <!-- Console Output Panel -->
        <div class="panel">
            <div class="panel-header">
                <span class="status-indicator" id="console-status"></span>
                Debug Console
            </div>
            <div class="panel-content">
                <div class="console-output" id="console-output">
                    <!-- Console output will appear here -->
                </div>
            </div>
        </div>
    </div>
    
    <!-- Core Scripts -->
    <script src="js/config.js"></script>
    <script src="js/scene3d-modular.js"></script>
    <script src="js/modelloader.js"></script>
    <script src="js/core/DragDropSystem.js"></script>
    <script src="js/core/AssemblySystem.js"></script>
    <script src="js/core/AssemblyConfigParser.js"></script>
    
    <script>
        // Global debug state
        let scene3D = null;
        let debugConsole = null;
        let metricsInterval = null;
        let fpsCounter = { frames: 0, lastTime: 0, fps: 0 };
        let systemState = {
            initialized: false,
            dragDropEnabled: false,
            assemblyEnabled: false,
            currentConfig: null
        };
        
        // Debug console implementation
        class DebugConsole {
            constructor(elementId) {
                this.element = document.getElementById(elementId);
                this.logs = [];
                this.maxLogs = 500;
            }
            
            log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = {
                    message,
                    type,
                    timestamp,
                    id: Date.now() + Math.random()
                };
                
                this.logs.push(logEntry);
                
                // Keep only recent logs
                if (this.logs.length > this.maxLogs) {
                    this.logs = this.logs.slice(-this.maxLogs);
                }
                
                this.render();
                console.log(`[${type.toUpperCase()}] ${message}`);
            }
            
            render() {
                const html = this.logs.map(entry => 
                    `<div class="log-line ${entry.type}">
                        <span class="timestamp">[${entry.timestamp}]</span> ${entry.message}
                    </div>`
                ).join('');
                
                this.element.innerHTML = html;
                this.element.scrollTop = this.element.scrollHeight;
            }
            
            clear() {
                this.logs = [];
                this.render();
            }
        }
        
        // Initialize debug console
        function initDebugConsole() {
            debugConsole = new DebugConsole('console-output');
            debugConsole.log('🐛 Debug console initialized', 'success');
            
            // Override console methods to capture logs
            const originalLog = console.log;
            const originalWarn = console.warn;
            const originalError = console.error;
            
            console.log = function(...args) {
                debugConsole.log(args.join(' '), 'debug');
                originalLog.apply(console, args);
            };
            
            console.warn = function(...args) {
                debugConsole.log(args.join(' '), 'warning');
                originalWarn.apply(console, args);
            };
            
            console.error = function(...args) {
                debugConsole.log(args.join(' '), 'error');
                originalError.apply(console, args);
            };
        }
        
        // System initialization
        async function initSystems() {
            try {
                debugConsole.log('🚀 Initializing debug systems...', 'info');
                updateStatusIndicator('controls-status', 'active');
                
                // Initialize Scene3D
                if (!window.Scene3D) {
                    throw new Error('Scene3D not available');
                }
                
                scene3D = window.Scene3D;
                await scene3D.init();
                debugConsole.log('✅ Scene3D initialized', 'success');
                updateStatusIndicator('scene-status', 'active');
                
                // Initialize DragDropSystem
                if (!window.DragDropSystem.init(scene3D)) {
                    throw new Error('DragDropSystem initialization failed');
                }
                debugConsole.log('✅ DragDropSystem initialized', 'success');
                
                // Initialize AssemblySystem
                if (!window.AssemblySystem.init(scene3D)) {
                    throw new Error('AssemblySystem initialization failed');
                }
                debugConsole.log('✅ AssemblySystem initialized', 'success');
                
                // Create test objects
                await createTestObjects();
                
                // Start metrics monitoring
                startMetricsMonitoring();
                
                systemState.initialized = true;
                debugConsole.log('🎉 All systems initialized successfully', 'success');
                updateStatusIndicator('metrics-status', 'active');
                updateStatusIndicator('console-status', 'active');
                
            } catch (error) {
                debugConsole.log(`❌ Initialization failed: ${error.message}`, 'error');
                updateStatusIndicator('controls-status', 'error');
                console.error('Initialization error:', error);
            }
        }
        
        // Create test 3D objects
        async function createTestObjects() {
            const testObjects = [
                { name: 'base', color: 0x4CAF50, position: [0, 0, 0] },
                { name: 'filtro', color: 0x2196F3, position: [1, 0, 0] },
                { name: 'coperchio', color: 0xFF9800, position: [-1, 0, 0] },
                { name: 'vite_1', color: 0xE91E63, position: [0, 0, 1] },
                { name: 'vite_2', color: 0x9C27B0, position: [0, 0, -1] }
            ];
            
            scene3D.loadedModels = scene3D.loadedModels || [];
            
            testObjects.forEach(objData => {
                const geometry = new THREE.BoxGeometry(0.3, 0.3, 0.3);
                const material = new THREE.MeshLambertMaterial({ color: objData.color });
                const mesh = new THREE.Mesh(geometry, material);
                
                mesh.position.set(...objData.position);
                mesh.name = objData.name;
                mesh.userData.isTestObject = true;
                
                scene3D.scene.add(mesh);
                scene3D.loadedModels.push(mesh);
            });
            
            debugConsole.log(`✅ Created ${testObjects.length} test objects`, 'success');
        }
        
        // Test configurations
        const testConfigs = {
            simple: {
                sequence: ["base", "filtro", "coperchio"],
                snapPoints: {
                    "base": {
                        nodeId: "base",
                        positions: [{ id: "base_center", position: [0, 0, 0], rotation: [0, 0, 0] }]
                    },
                    "filtro": {
                        nodeId: "filtro", 
                        positions: [
                            { id: "filtro_center", position: [0, 0.4, 0], rotation: [0, 0, 0] },
                            { id: "filtro_offset", position: [0.3, 0.4, 0.3], rotation: [0, 0.7854, 0] }
                        ]
                    },
                    "coperchio": {
                        nodeId: "coperchio",
                        positions: [{ id: "coperchio_top", position: [0, 0.8, 0], rotation: [0, 0, 0] }]
                    }
                },
                dependencies: {
                    "filtro": ["base"],
                    "coperchio": ["base", "filtro"]
                }
            },
            
            complex: {
                sequence: ["base", "gruppo_viti", "coperchio"],
                snapPoints: {
                    "base": {
                        nodeId: "base",
                        positions: [{ id: "base_center", position: [0, 0, 0], rotation: [0, 0, 0] }]
                    },
                    "vite_1": {
                        nodeId: "gruppo_viti",
                        positions: [
                            { id: "vite_pos_1", position: [0.4, 0.2, 0.4], rotation: [0, 0, 0] },
                            { id: "vite_pos_2", position: [0.4, 0.2, -0.4], rotation: [0, 0, 0] }
                        ]
                    },
                    "vite_2": {
                        nodeId: "gruppo_viti",
                        positions: [
                            { id: "vite_pos_3", position: [-0.4, 0.2, 0.4], rotation: [0, 0, 0] },
                            { id: "vite_pos_4", position: [-0.4, 0.2, -0.4], rotation: [0, 0, 0] }
                        ]
                    },
                    "coperchio": {
                        nodeId: "coperchio",
                        positions: [{ id: "coperchio_final", position: [0, 0.6, 0], rotation: [0, 0, 0] }]
                    }
                },
                interchangeableNodes: {
                    "gruppo_viti": ["vite_1", "vite_2"]
                },
                dependencies: {
                    "gruppo_viti": ["base"],
                    "coperchio": ["base", "gruppo_viti"]
                }
            },
            
            interchangeable: {
                sequence: ["base", "gruppo_connettori", "coperchio"],
                snapPoints: {
                    "base": {
                        nodeId: "base",
                        positions: [{ id: "base_center", position: [0, 0, 0], rotation: [0, 0, 0] }]
                    },
                    "filtro": {
                        nodeId: "gruppo_connettori",
                        positions: [{ id: "conn_slot_1", position: [0.3, 0.2, 0], rotation: [0, 0, 0] }]
                    },
                    "vite_1": {
                        nodeId: "gruppo_connettori", 
                        positions: [{ id: "conn_slot_2", position: [-0.3, 0.2, 0], rotation: [0, 0, 0] }]
                    },
                    "coperchio": {
                        nodeId: "coperchio",
                        positions: [{ id: "coperchio_top", position: [0, 0.6, 0], rotation: [0, 0, 0] }]
                    }
                },
                interchangeableNodes: {
                    "gruppo_connettori": ["filtro", "vite_1", "vite_2"]
                },
                dependencies: {
                    "gruppo_connettori": ["base"],
                    "coperchio": ["base", "gruppo_connettori"]
                }
            }
        };
        
        // Control functions
        function loadTestConfig() {
            const select = document.getElementById('test-config');
            const configType = select.value;
            
            if (!configType || !testConfigs[configType]) {
                debugConsole.log('⚠️ No valid test config selected', 'warning');
                return;
            }
            
            try {
                systemState.currentConfig = testConfigs[configType];
                debugConsole.log(`📋 Loaded test config: ${configType}`, 'success');
                debugConsole.log(`   Sequence: [${systemState.currentConfig.sequence.join(', ')}]`, 'info');
                debugConsole.log(`   Components: ${Object.keys(systemState.currentConfig.snapPoints).length}`, 'info');
                
            } catch (error) {
                debugConsole.log(`❌ Config loading error: ${error.message}`, 'error');
            }
        }
        
        function enableAssembly() {
            if (!systemState.currentConfig) {
                debugConsole.log('❌ No configuration loaded', 'error');
                return;
            }
            
            try {
                const result = window.AssemblySystem.enableAssemblyMode(systemState.currentConfig);
                
                if (result) {
                    systemState.assemblyEnabled = true;
                    debugConsole.log('✅ Assembly mode enabled', 'success');
                } else {
                    debugConsole.log('❌ Failed to enable assembly mode', 'error');
                }
                
            } catch (error) {
                debugConsole.log(`❌ Assembly enable error: ${error.message}`, 'error');
            }
        }
        
        function disableAssembly() {
            try {
                window.AssemblySystem.disableAssemblyMode();
                systemState.assemblyEnabled = false;
                debugConsole.log('🔴 Assembly mode disabled', 'warning');
                
            } catch (error) {
                debugConsole.log(`❌ Assembly disable error: ${error.message}`, 'error');
            }
        }
        
        function stepForward() {
            try {
                const status = window.AssemblySystem.getAssemblyStatus();
                const nextStep = status.currentStep + 1;
                
                const result = window.AssemblySystem.setCurrentAssemblyStep(nextStep);
                
                if (result) {
                    debugConsole.log(`✅ Advanced to step: ${nextStep}`, 'success');
                } else {
                    debugConsole.log(`❌ Cannot advance to step: ${nextStep}`, 'warning');
                }
                
            } catch (error) {
                debugConsole.log(`❌ Step forward error: ${error.message}`, 'error');
            }
        }
        
        function undoAction() {
            try {
                const result = window.AssemblySystem.undo();
                
                if (result) {
                    debugConsole.log('↩️ Undo successful', 'success');
                } else {
                    debugConsole.log('⚠️ Nothing to undo', 'warning');
                }
                
            } catch (error) {
                debugConsole.log(`❌ Undo error: ${error.message}`, 'error');
            }
        }
        
        function redoAction() {
            try {
                const result = window.AssemblySystem.redo();
                
                if (result) {
                    debugConsole.log('↪️ Redo successful', 'success');
                } else {
                    debugConsole.log('⚠️ Nothing to redo', 'warning');
                }
                
            } catch (error) {
                debugConsole.log(`❌ Redo error: ${error.message}`, 'error');
            }
        }
        
        function validateState() {
            try {
                const validation = window.AssemblySystem.validateAssemblySequence();
                
                if (validation.valid) {
                    debugConsole.log('✅ Assembly state is valid', 'success');
                } else {
                    debugConsole.log('❌ Assembly state validation failed:', 'error');
                    validation.errors.forEach(error => {
                        debugConsole.log(`   - ${error}`, 'error');
                    });
                }
                
            } catch (error) {
                debugConsole.log(`❌ Validation error: ${error.message}`, 'error');
            }
        }
        
        function inspectComponent() {
            const componentName = document.getElementById('component-name').value.trim();
            
            if (!componentName) {
                debugConsole.log('⚠️ No component name specified', 'warning');
                return;
            }
            
            try {
                // Find component in scene
                const component = scene3D.loadedModels?.find(model => 
                    model.name.toLowerCase() === componentName.toLowerCase()
                );
                
                if (!component) {
                    debugConsole.log(`❌ Component '${componentName}' not found`, 'error');
                    return;
                }
                
                // Get component data
                const componentData = {
                    name: component.name,
                    position: component.position.toArray(),
                    rotation: component.rotation.toArray(),
                    uuid: component.uuid,
                    isMountable: window.AssemblySystem.isComponentMountable(componentName),
                    snapPoints: window.AssemblySystem.getAvailableSnapPoints(componentName)
                };
                
                document.getElementById('component-data').textContent = 
                    JSON.stringify(componentData, null, 2);
                
                debugConsole.log(`🔍 Inspected component: ${componentName}`, 'info');
                
            } catch (error) {
                debugConsole.log(`❌ Component inspection error: ${error.message}`, 'error');
            }
        }
        
        function resetSystems() {
            if (confirm('Reset all systems? This will clear all data.')) {
                try {
                    window.AssemblySystem.reset();
                    window.DragDropSystem.reset();
                    
                    systemState.initialized = false;
                    systemState.assemblyEnabled = false;
                    systemState.currentConfig = null;
                    
                    debugConsole.log('🔄 All systems reset', 'warning');
                    
                    // Reset status indicators
                    updateStatusIndicator('scene-status', 'inactive');
                    updateStatusIndicator('controls-status', 'inactive');
                    updateStatusIndicator('metrics-status', 'inactive');
                    
                } catch (error) {
                    debugConsole.log(`❌ Reset error: ${error.message}`, 'error');
                }
            }
        }
        
        function clearLogs() {
            debugConsole.clear();
        }
        
        // Metrics monitoring
        function startMetricsMonitoring() {
            if (metricsInterval) {
                clearInterval(metricsInterval);
            }
            
            metricsInterval = setInterval(updateMetrics, 1000);
            debugConsole.log('📊 Started metrics monitoring', 'info');
        }
        
        function updateMetrics() {
            try {
                const metrics = {
                    'System Status': systemState.initialized ? 'Initialized' : 'Not Ready',
                    'Assembly Mode': systemState.assemblyEnabled ? 'Enabled' : 'Disabled',
                    'DragDrop Status': window.DragDropSystem.isEnabled() ? 'Active' : 'Inactive',
                    'Scene Objects': scene3D?.scene?.children?.length || 0,
                    'Loaded Models': scene3D?.loadedModels?.length || 0,
                    'FPS': fpsCounter.fps.toFixed(1),
                };
                
                // Get assembly status if enabled
                if (systemState.assemblyEnabled) {
                    const status = window.AssemblySystem.getAssemblyStatus();
                    metrics['Current Step'] = `${status.currentStep}/${status.totalSteps}`;
                    metrics['Mounted Components'] = status.mountedComponents.length;
                    metrics['Available Components'] = status.availableComponents.length;
                }
                
                // Update metrics display
                const container = document.getElementById('metrics-container');
                container.innerHTML = Object.entries(metrics).map(([label, value]) => 
                    `<div class="metric">
                        <div class="metric-label">${label}</div>
                        <div class="metric-value">${value}</div>
                    </div>`
                ).join('');
                
                // Update scene overlay
                updateSceneOverlay();
                
            } catch (error) {
                debugConsole.log(`❌ Metrics update error: ${error.message}`, 'error');
            }
        }
        
        function updateSceneOverlay() {
            if (!scene3D) return;
            
            document.getElementById('object-count').textContent = scene3D.scene.children.length;
            document.getElementById('triangle-count').textContent = 
                scene3D.renderer ? scene3D.renderer.info.render.triangles : '0';
            document.getElementById('fps-counter').textContent = fpsCounter.fps.toFixed(1);
            
            if (scene3D.camera) {
                const pos = scene3D.camera.position;
                document.getElementById('camera-pos').textContent = 
                    `${pos.x.toFixed(1)},${pos.y.toFixed(1)},${pos.z.toFixed(1)}`;
            }
        }
        
        function updateStatusIndicator(id, status) {
            const indicator = document.getElementById(id);
            if (indicator) {
                indicator.className = `status-indicator ${status}`;
            }
        }
        
        // FPS monitoring
        function animate() {
            requestAnimationFrame(animate);
            
            const now = performance.now();
            fpsCounter.frames++;
            
            if (now - fpsCounter.lastTime >= 1000) {
                fpsCounter.fps = fpsCounter.frames / ((now - fpsCounter.lastTime) / 1000);
                fpsCounter.frames = 0;
                fpsCounter.lastTime = now;
            }
            
            if (window.TWEEN) {
                TWEEN.update();
            }
            
            if (scene3D?.renderer) {
                scene3D.renderer.render(scene3D.scene, scene3D.camera);
            }
        }
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            initDebugConsole();
            animate();
            
            // Set all indicators to inactive initially
            updateStatusIndicator('scene-status', 'inactive');
            updateStatusIndicator('controls-status', 'inactive');
            updateStatusIndicator('metrics-status', 'inactive');
            updateStatusIndicator('console-status', 'active');
            
            debugConsole.log('🐛 Assembly System Debug Console Ready', 'success');
        });
        
        // Cleanup on window close
        window.addEventListener('beforeunload', function() {
            if (metricsInterval) {
                clearInterval(metricsInterval);
            }
        });
    </script>
</body>
</html>
