# InterfaceConfig.ini - Configurazione Interfaccia Utente
# Posizionato alla stessa directory di home_config.ini
#
# Questo file permette di configurare gli elementi dell'interfaccia
# senza modificare il codice sorgente.

[ResetCameraButton]
# Posizione del pulsante di reset vista camera
# Valori: top-right | top-left | top-center | bottom-right | bottom-left | bottom-center
Position=bottom-left

[CameraControls]
# Inverti la direzione verticale della rotazione camera (su/giu)
# true  = movimento mouse su   → camera va su   (stile "normale")
# false = movimento mouse giu' → camera va su   (stile "inverso", default)
InvertVertical=true
# Inverti la direzione orizzontale della rotazione camera (sinistra/destra)
# true  = movimento mouse destra → camera ruota a sinistra
# false = movimento mouse destra → camera ruota a destra (default)
InvertHorizontal=false

# --- Zoom Pinch (touch) ---
# Sensibilita' del pinch-to-zoom (default: 0.003 | range consigliato: 0.001 - 0.010)
PinchSensitivity=0.001
# Inverti il senso del pinch-to-zoom
# false = apertura dita → avvicina (zoom in)   [default, comportamento naturale]
# true  = apertura dita → allontana (zoom out)
InvertPinchZoom=false

# --- Zoom Scroll (mouse) ---
# Sensibilita' dello scroll wheel (default: 0.025 | range consigliato: 0.010 - 0.060)
ScrollSensitivity=0.01
# Inverti il senso dello scroll
# false = scroll giu' → allontana (zoom out)   [default]
# true  = scroll giu' → avvicina (zoom in)
InvertScrollZoom=false

# --- Limiti Zoom ---
# Distanza minima camera dal pivot (quanto ci si puo' avvicinare)
# default: 0.15  |  valori tipici: 0.05 (vicinissimo) - 1.0 (distante)
ZoomMin=0.15
# Distanza massima camera dal pivot (quanto ci si puo' allontanare)
# default: 15    |  valori tipici: 5 (vicino) - 50 (lontano)
ZoomMax=1.3

[SpeechBubble]
# Durata dell'animazione drammatica del fumetto (ms) quando HighlightDescription=true
# default: 1000 | range consigliato: 500 - 3000
DramaticAnimationDuration=2000

[Highlight]
# Evidenziazione pulsanti richiesti (velatura colorata sul materiale del pulsante).
# Formula finale: emissiveIntensity = HighlightOpacity (per-step) x IntensityScale (qui).
# Quando un pulsante viene "richiesto" da uno step (AcceptTrigger_Physical),
# riceve una tinta emissiva che lo fa risaltare. Questi parametri controllano
# colore, forza e comportamento del materiale di tutti gli highlight.

# Colore della tinta emissiva (esadecimale 0xRRGGBB)
# default: 0xffff00 (giallo)  |  esempi: 0xffaa00 (ambra), 0xff8800 (arancio), 0x00ffff (ciano)
Color=0xffff00

# Scala dell'intensita' emissive applicata sopra HighlightOpacity dello step.
# Abbassa questo valore se "tutti" gli highlight sono troppo gialli/aggressivi.
# default: 0.6  |  range consigliato: 0.2 (molto tenue) - 1.2 (molto acceso)
IntensityScale=0.05

# Opacita' di default usata quando uno step NON specifica HighlightOpacity.
# Sostituisce il fallback hard-coded di 0.5. Singoli step possono sovrascrivere
# con `HighlightOpacity=...` nel file tutorial.
# default: 0.5  |  range: 0.0 (invisibile) - 1.0 (massimo)
DefaultOpacity=0.2

# Riduce anche material.opacity (vecchio look "see-through" con pulsante semi-trasparente).
# false (default) = il pulsante resta opaco, si vede solo la tinta.
# true            = il pulsante diventa anche piu' trasparente sotto la tinta.
FadeMaterial=false

# Quanto fade applicare a material.opacity quando FadeMaterial=true.
# Formula: opacity = 1 - (1 - HighlightOpacity) x FadeStrength
# default: 0.5  |  range: 0.0 (nessun fade) - 1.0 (fade massimo)
FadeStrength=1
