CameraPos=(-1.11, 1.44, 3.97)                               // Camera positioned farther for complete framing
CameraTarget=(0, 0, 0)                                    // Camera points to scene center
AmbientLight=0xffffff,1.05                                 // Ambient light for general illumination
DirectionalLight=0xffffff,1.05,(-8, 15, 0)               // Main directional light from upper right
BackLight=0xffffff,2,(-8, 15,  5 )                      // Back light to eliminate harsh shadows

// === SZENARIOINFORMATIONEN ===
description=Steuerung und Wartung der Elektrospindel mit HSK-Kegeln: Reinigung der Spannzange, Schmierung, manuelles Öffnen/Schließen der Spannzange.
