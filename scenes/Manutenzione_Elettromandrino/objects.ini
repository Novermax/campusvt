# ═══════════════════════════════════════════════════════════════════════════
# MANUTENZIONE ELETTROMANDRINO - Objects & States
# ═══════════════════════════════════════════════════════════════════════════
# Definizioni statiche di stati (StateGroup) e oggetti interattivi (InteractiveObject).
# Caricato prima del tutorial.cvtscript dal loader modulare.

# ═══════════════════════════════════════════════════════════════════════════
# STATE GROUPS - Varianti mutuamente esclusive
# ═══════════════════════════════════════════════════════════════════════════

# Chiave accensione: due stati (off/on)
[state chiave]
Variants=chiave0,chiave1
Default=chiave0

# Pulsante Start: due stati (off/on)
[state start]
Variants=pstart0,pstart1
Default=pstart1

# Emergenza: due stati (off/on)
[state emergenza]
Variants=emergenza_off,emergenza_on
Default=emergenza_off

# Schermi: varianti (home/mdi/tool/running)
[state schermo]
Variants=schermo001,schermo002,schermo003,schermo004,schermo007,schermo008,schermo009,schermo010,schermo011
Default=schermo001

[state schermo_remote]
Variants=Schermo_R000,Schermo_R001
Default=Schermo_R000

# Utensile: due varianti, tool1 sull'elettromandrino e tool0 nel magazzino
[state tool]
Variants=tool0,tool1
Default=tool1

# ═══════════════════════════════════════════════════════════════════════════
# DEFINIZIONE OGGETTO INTERATTIVO: PULPITO
# ═══════════════════════════════════════════════════════════════════════════

[object pulpito]
Model=models/pulpito.glb

# Chiave rotante - click cambia variante StateGroup "chiave"
InteractiveChild=chiave0,button,onClick:cycleVariant:chiave
InteractiveChild=chiave1,button,onClick:cycleVariant:chiave

# Pulsanti navigazione schermi - cambiano variante StateGroup "schermo"
InteractiveChild=Pulsante_mdi,button,onClick:setVariant:schermo=schermo002
InteractiveChild=Pulsante_tool,button,onClick:setVariant:schermo=schermo003
InteractiveChild=Pulsante_WH,button,onClick:setVariant:schermo=schermo008
InteractiveChild=Pulsante_electrospindle,button,onClick:setVariant:schermo=schermo009
InteractiveChild=Pulsante_LU,button,onClick:setVariant:schermo=schermo010

# Fungo di emergenza - cambia variante StateGroup "emergenza"
InteractiveChild=emergenza_off,button,onClick:setVariant:emergenza=emergenza_on
InteractiveChild=emergenza_on,button,onClick:setVariant:emergenza=emergenza_off

# Pulsante Start - cambia variante StateGroup "start"
InteractiveChild=pstart0,button,onClick:cycleVariant:start
InteractiveChild=pstart1,button,onClick:cycleVariant:start

# ═══════════════════════════════════════════════════════════════════════════
# DEFINIZIONE OGGETTO INTERATTIVO: REMOTE (TELECOMANDO)
# ═══════════════════════════════════════════════════════════════════════════

[object remote]
Model=models/remote.glb

# Pulsante play sul telecomando
InteractiveChild=pulsante_r_play,button,onClick:setVariant:start=pstart1

# Pulsante status sul telecomando
InteractiveChild=Pulsante_r_status,button,onClick:setVariant:schermo_remote=Schermo_R001

# Pulsante unlock sul telecomando (per animazione apri/chiudi)
InteractiveChild=Pulsante_r_unlock,button

# ═══════════════════════════════════════════════════════════════════════════
# DEFINIZIONE OGGETTO INTERATTIVO: MACCHINA A500
# ═══════════════════════════════════════════════════════════════════════════

[object a500]
Model=models/a500.glb

# ═══════════════════════════════════════════════════════════════════════════
# MODELLI UTENSILI - Gestiti dal StateGroup "tool"
# ═══════════════════════════════════════════════════════════════════════════

# Tool1: utensile montato sull'elettromandrino (visibile all'inizio)
# Forma esplicita: queste righe sono dentro [object a500] e il parser non
# normalizza Element→Elemento dentro i block speciali. Preserva il comportamento v1/v2.
Elemento=models/utensile.glb
Posizione=utensile:(2.8, 2.5, -0.7)
Rotazione=utensile:(0, 0, 0)
