<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Drag & Drop Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: monospace;
            background: #1a1a1a;
            color: #ffffff;
        }
        
        #debug {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            white-space: pre-line;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .step {
            margin: 10px 0;
            padding: 10px;
            border-left: 4px solid #4CAF50;
            background: #333;
        }
        
        .error {
            border-left-color: #f44336;
            background: #441111;
        }
        
        .warning {
            border-left-color: #ff9800;
            background: #442211;
        }
        
        canvas {
            border: 1px solid #555;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🔍 Debug Test Drag & Drop System</h1>
    
    <div id="debug"></div>
    
    <canvas id="canvas3d" width="800" height="600"></canvas>
    
    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.155.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.155.0/examples/jsm/"
            }
        }
    </script>
    
    <script>
        const debugDiv = document.getElementById('debug');
        let stepCounter = 0;
        
        function debugLog(message, type = 'info') {
            stepCounter++;
            const timestamp = new Date().toLocaleTimeString();
            const step = document.createElement('div');
            step.className = `step ${type}`;
            step.textContent = `[${stepCounter}] [${timestamp}] ${message}`;
            debugDiv.appendChild(step);
            debugDiv.scrollTop = debugDiv.scrollHeight;
            
            if (type === 'error') {
                console.error(message);
            } else if (type === 'warning') {
                console.warn(message);
            } else {
                console.log(message);
            }
        }
        
        // Configurazione minimale
        window.AppConfig = {
            log: function(level, message) {
                debugLog(`AppConfig[${level}]: ${message}`);
            }
        };
        
        // Override console per debug
        const originalError = console.error;
        console.error = function(...args) {
            debugLog(`CONSOLE ERROR: ${args.join(' ')}`, 'error');
            originalError(...args);
        };
        
        window.addEventListener('error', (event) => {
            debugLog(`GLOBAL ERROR: ${event.error?.message || event.message} at ${event.filename}:${event.lineno}`, 'error');
        });
        
        debugLog('🚀 Avvio debug test sistema drag & drop');
        
        async function debugTest() {
            try {
                debugLog('Importazione Three.js...');
                
                // Import Three.js
                const THREE = await import('three');
                window.THREE = THREE;
                debugLog('✅ Three.js importato e disponibile globalmente');
                
                // Test caricamento moduli
                debugLog('Caricamento DragDropSystem...');
                await loadScript('./js/core/DragDropSystem.js');
                
                debugLog('Verifica DragDropSystem...');
                if (window.DragDropSystem) {
                    debugLog('✅ window.DragDropSystem disponibile');
                    debugLog(`DragDropSystem metodi: ${Object.keys(window.DragDropSystem).join(', ')}`);
                } else {
                    debugLog('❌ window.DragDropSystem non trovato', 'error');
                }
                
                debugLog('Caricamento Scene3D...');
                await loadScript('./js/scene3d-modular.js');
                
                debugLog('Verifica Scene3D...');
                if (window.Scene3D) {
                    debugLog('✅ window.Scene3D disponibile');
                    debugLog(`Scene3D metodi: ${Object.keys(window.Scene3D).slice(0, 10).join(', ')}...`);
                } else {
                    debugLog('❌ window.Scene3D non trovato', 'error');
                    return;
                }
                
                debugLog('Verifica Scene3D.init...');
                if (typeof window.Scene3D.init === 'function') {
                    debugLog('✅ Scene3D.init è una funzione');
                } else {
                    debugLog(`❌ Scene3D.init non è una funzione: ${typeof window.Scene3D.init}`, 'error');
                    return;
                }
                
                debugLog('Chiamata Scene3D.init()...');
                const initResult = window.Scene3D.init();
                debugLog(`Risultato init(): ${initResult}`);
                
                debugLog('Verifica proprietà Scene3D dopo init...');
                debugLog(`Scene3D.scene: ${window.Scene3D.scene ? 'OK' : 'UNDEFINED'}`);
                debugLog(`Scene3D.camera: ${window.Scene3D.camera ? 'OK' : 'UNDEFINED'}`);
                debugLog(`Scene3D.renderer: ${window.Scene3D.renderer ? 'OK' : 'UNDEFINED'}`);
                debugLog(`Scene3D.canvas: ${window.Scene3D.canvas ? 'OK' : 'UNDEFINED'}`);
                debugLog(`Scene3D.raycaster: ${window.Scene3D.raycaster ? 'OK' : 'UNDEFINED'}`);
                debugLog(`Scene3D.mouse: ${window.Scene3D.mouse ? 'OK' : 'UNDEFINED'}`);
                
                if (!window.Scene3D.scene) {
                    debugLog('❌ Scene3D.scene è undefined dopo init', 'error');
                    return;
                }
                
                if (!window.Scene3D.camera) {
                    debugLog('❌ Scene3D.camera è undefined dopo init', 'error');
                    return;
                }
                
                debugLog('✅ Scene3D inizializzato correttamente!');
                
                // Test drag & drop
                debugLog('Test metodi drag & drop...');
                
                if (typeof window.Scene3D.enableDragDrop === 'function') {
                    debugLog('✅ enableDragDrop disponibile');
                } else {
                    debugLog('❌ enableDragDrop non disponibile', 'error');
                }
                
                if (typeof window.Scene3D.isDragDropEnabled === 'function') {
                    debugLog('✅ isDragDropEnabled disponibile');
                    const isEnabled = window.Scene3D.isDragDropEnabled();
                    debugLog(`Drag & Drop enabled: ${isEnabled}`);
                } else {
                    debugLog('❌ isDragDropEnabled non disponibile', 'error');
                }
                
                debugLog('🎉 Test completato con successo!');
                
            } catch (error) {
                debugLog(`💥 ERRORE DURANTE TEST: ${error.message}`, 'error');
                debugLog(`Stack: ${error.stack}`, 'error');
            }
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                debugLog(`Caricamento script: ${src}`);
                const script = document.createElement('script');
                script.src = src;
                script.onload = () => {
                    debugLog(`✅ Script caricato: ${src}`);
                    resolve();
                };
                script.onerror = (error) => {
                    debugLog(`❌ Errore caricamento script: ${src}`, 'error');
                    reject(new Error(`Errore caricamento ${src}`));
                };
                document.head.appendChild(script);
            });
        }
        
        // Avvia test
        document.addEventListener('DOMContentLoaded', () => {
            debugLog('DOM Ready, avvio test...');
            setTimeout(debugTest, 100);
        });
        
    </script>
</body>
</html>
