<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Semplice Drag & Drop</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
        }
        
        #status {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
        }
        
        .success { color: green; }
        .error { color: red; }
        .warning { color: orange; }
        
        canvas {
            display: block;
            margin: 20px auto;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        button:hover { background: #45a049; }
        button:disabled { background: #ccc; cursor: not-allowed; }
    </style>
</head>
<body>
    <h1>🎯 Test Semplice Drag & Drop</h1>
    
    <div id="status">
        <h3>Stato:</h3>
        <div id="statusText">Inizializzazione...</div>
    </div>
    
    <div>
        <button id="enableBtn" disabled>Abilita Drag & Drop</button>
        <button id="disableBtn" disabled>Disabilita Drag & Drop</button>
        <button id="addObjectsBtn" disabled>Aggiungi Cubi Test</button>
    </div>
    
    <canvas id="canvas3d" width="800" height="600"></canvas>
    
    <!-- Three.js Import Map -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.155.0/build/three.module.js"
            }
        }
    </script>
    
    <script>        
        const statusDiv = document.getElementById('statusText');
        const enableBtn = document.getElementById('enableBtn');
        const disableBtn = document.getElementById('disableBtn');
        const addObjectsBtn = document.getElementById('addObjectsBtn');
        
        let scene3D = null;
        let testCubes = [];
        
        function updateStatus(message, type = 'info') {
            statusDiv.innerHTML = `<span class="${type}">${message}</span>`;
            console.log(`[STATUS] ${message}`);
        }
        
        async function initTest() {
            try {
                updateStatus('Caricamento Three.js...');
                
                // Import Three.js
                const THREE = await import('three');
                window.THREE = THREE;
                updateStatus('✅ Three.js caricato');
                
                // Carica config.js PRIMA di tutto
                updateStatus('Caricamento Config...');
                await loadScript('./js/config.js');
                
                if (!window.AppConfig || !window.AppConfig.scene3D) {
                    throw new Error('AppConfig non caricato correttamente');
                }
                updateStatus('✅ Config caricato');
                
                // Carica moduli uno alla volta con controlli
                updateStatus('Caricamento DragDropSystem...');
                await loadScript('./js/core/DragDropSystem.js');
                
                if (!window.DragDropSystem) {
                    throw new Error('DragDropSystem non caricato');
                }
                updateStatus('✅ DragDropSystem caricato');
                
                updateStatus('Caricamento Scene3D...');
                await loadScript('./js/scene3d-modular.js');
                
                if (!window.Scene3D) {
                    throw new Error('Scene3D non caricato');
                }
                updateStatus('✅ Scene3D caricato');
                
                // Inizializza Scene3D
                updateStatus('Inizializzazione Scene3D...');
                scene3D = window.Scene3D;
                
                const initSuccess = scene3D.init();
                
                if (!initSuccess) {
                    throw new Error('Inizializzazione Scene3D fallita');
                }
                
                // Verifica che tutto sia inizializzato
                if (!scene3D.scene || !scene3D.camera || !scene3D.renderer) {
                    throw new Error('Scene3D non completamente inizializzato');
                }
                
                updateStatus('✅ Sistema inizializzato correttamente!', 'success');
                
                // Abilita pulsanti
                enableBtn.disabled = false;
                disableBtn.disabled = false;
                addObjectsBtn.disabled = false;
                
                // Aggiungi oggetti test automaticamente
                addTestCubes();
                
            } catch (error) {
                updateStatus(`❌ Errore: ${error.message}`, 'error');
                console.error('Errore inizializzazione:', error);
            }
        }
        
        function loadScript(src) {
            return new Promise((resolve, reject) => {
                const script = document.createElement('script');
                script.src = src;
                script.onload = resolve;
                script.onerror = () => reject(new Error(`Errore caricamento ${src}`));
                document.head.appendChild(script);
            });
        }
        
        function addTestCubes() {
            if (!scene3D || !scene3D.scene || typeof THREE === 'undefined') {
                updateStatus('❌ Sistema non pronto per creare oggetti', 'error');
                return;
            }
            
            try {
                const colors = [0xff6b6b, 0x4ecdc4, 0x45b7d1, 0xf7b731, 0x5f27cd];
                const positions = [
                    [-2, 0.5, -2], [2, 0.5, -2], [0, 0.5, 0], 
                    [-2, 0.5, 2], [2, 0.5, 2]
                ];
                
                positions.forEach((pos, i) => {
                    const geometry = new THREE.BoxGeometry(1, 1, 1);
                    const material = new THREE.MeshLambertMaterial({ 
                        color: colors[i % colors.length] 
                    });
                    
                    const cube = new THREE.Mesh(geometry, material);
                    cube.position.set(pos[0], pos[1], pos[2]);
                    cube.name = `TestCube_${i + 1}`;
                    
                    scene3D.scene.add(cube);
                    if (scene3D.loadedModels) {
                        scene3D.loadedModels.push(cube);
                    }
                    testCubes.push(cube);
                });
                
                updateStatus(`✅ Creati ${testCubes.length} cubi test`, 'success');
                
            } catch (error) {
                updateStatus(`❌ Errore creazione cubi: ${error.message}`, 'error');
            }
        }
        
        // Event listeners
        enableBtn.onclick = () => {
            try {
                scene3D.enableDragDrop();
                updateStatus('✅ Drag & Drop abilitato', 'success');
            } catch (error) {
                updateStatus(`❌ Errore abilitazione: ${error.message}`, 'error');
            }
        };
        
        disableBtn.onclick = () => {
            try {
                scene3D.disableDragDrop();
                updateStatus('✅ Drag & Drop disabilitato', 'success');
            } catch (error) {
                updateStatus(`❌ Errore disabilitazione: ${error.message}`, 'error');
            }
        };
        
        addObjectsBtn.onclick = addTestCubes;
        
        // Avvia test
        document.addEventListener('DOMContentLoaded', initTest);
        
    </script>
</body>
</html>
