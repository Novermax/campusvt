<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cursore Semplice</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
        }
        
        .test-area {
            width: 600px;
            height: 400px;
            background: #333;
            border: 2px solid #666;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        
        /* Test cursore con body class */
        body.tool-aria-active {
            cursor: url("cursors/pistola_normale.svg") 3 3, auto !important;
        }
        
        body.tool-aria-active:active,
        body.tool-aria-active.mouse-pressed {
            cursor: url("cursors/pistola_premuto.svg") 3 3, auto !important;
        }
        
        body.tool-aria-active * {
            cursor: inherit !important;
        }
        
        /* Test cursore diretto */
        .direct-cursor {
            cursor: url("cursors/pistola_normale.svg") 3 3, auto;
        }
        
        .direct-cursor:active {
            cursor: url("cursors/pistola_premuto.svg") 3 3, auto;
        }
        
        button {
            padding: 10px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin: 10px;
        }
        
        .info {
            background: #2d2d2d;
            padding: 15px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
        }
    </style>
</head>
<body>
    <h1>Test Cursore Aria - Debug Puro</h1>
    
    <div class="info" id="info">
        Status: Inizializzazione...
    </div>
    
    <button onclick="testBodyClass()">Test Body Class (tool-aria-active)</button>
    <button onclick="testDirectCursor()">Test Cursore Diretto</button>
    <button onclick="testMousePressed()">Test Mouse Premuto</button>
    <button onclick="clearAll()">Reset</button>
    
    <div class="test-area" id="testArea">
        Muovi il mouse qui per testare il cursore
    </div>
    
    <script>
        function updateInfo() {
            const bodyClasses = Array.from(document.body.classList);
            const bodyStyle = getComputedStyle(document.body);
            const testAreaStyle = getComputedStyle(document.getElementById('testArea'));
            
            document.getElementById('info').innerHTML = `
                <strong>DEBUG INFO:</strong><br>
                Body Classes: ${bodyClasses.join(', ') || 'nessuna'}<br>
                Body Cursor: ${bodyStyle.cursor}<br>
                Test Area Cursor: ${testAreaStyle.cursor}<br>
                Timestamp: ${new Date().toLocaleTimeString()}
            `;
        }
        
        function testBodyClass() {
            console.log('🧪 Test aggiunta classe body...');
            document.body.classList.add('tool-aria-active');
            updateInfo();
            console.log('✅ Classe aggiunta. Controlla il cursore.');
        }
        
        function testDirectCursor() {
            console.log('🧪 Test cursore diretto...');
            const testArea = document.getElementById('testArea');
            testArea.classList.add('direct-cursor');
            updateInfo();
            console.log('✅ Cursore diretto applicato all\'area test.');
        }
        
        function testMousePressed() {
            console.log('🧪 Test mouse premuto...');
            document.body.classList.add('mouse-pressed');
            setTimeout(() => {
                document.body.classList.remove('mouse-pressed');
                updateInfo();
                console.log('✅ Mouse released');
            }, 2000);
            updateInfo();
        }
        
        function clearAll() {
            console.log('🧪 Reset...');
            document.body.classList.remove('tool-aria-active', 'mouse-pressed');
            document.getElementById('testArea').classList.remove('direct-cursor');
            updateInfo();
            console.log('✅ Reset completato');
        }
        
        // Auto-update ogni secondo
        setInterval(updateInfo, 1000);
        updateInfo();
        
        console.log('🚀 Test cursore caricato. Usa i pulsanti per testare.');
    </script>
</body>
</html>
