<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Sistema Particellare - Versione Semplificata</title>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #canvas3d {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .controls {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            border-radius: 8px;
            z-index: 1000;
        }
        
        .tools {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 1000;
        }
        
        .tool-icon {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid #333;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            color: white;
            font-size: 12px;
            text-align: center;
        }
        
        .tool-icon:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: #666;
        }
        
        .tool-icon.active {
            background: rgba(76, 175, 80, 0.3);
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.5);
        }
        
        .test-button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 8px 15px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .test-button:hover {
            background: #45a049;
        }
        
        .stats {
            background: #333;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <canvas id="canvas3d"></canvas>
    
    <div class="controls">
        <h3>🧪 Test Sistema Particellare</h3>
        <p><strong>Istruzioni:</strong><br>
        1. Clicca sul tool "ARIA" qui sotto<br>
        2. Clicca su un oggetto 3D per creare getto aria</p>
        
        <button class="test-button" onclick="testAirJet()">💨 Test Automatico</button>
        <button class="test-button" onclick="clearEffects()">🧹 Pulisci</button>
        
        <div class="stats" id="stats">Caricamento...</div>
    </div>
    
    <div class="tools">
        <div class="tool-icon" data-tool="brugola" onclick="selectTool('brugola')">
            BRUGOLA
        </div>
        <div class="tool-icon" data-tool="chiave" onclick="selectTool('chiave')">
            CHIAVE
        </div>
        <div class="tool-icon" data-tool="mano" onclick="selectTool('mano')">
            MANO
        </div>
        <div class="tool-icon" data-tool="aria" onclick="selectTool('aria')">
            💨<br>ARIA
        </div>
    </div>

    <script>
        // Variabili globali
        let scene, camera, renderer, canvas;
        let particleSystem;
        let activeTool = null;
        let models = [];
        
        // Carica Three.js e poi inizializza
        function loadThreeJS() {
            // Proviamo prima un CDN alternativo
            const script = document.createElement('script');
            script.src = 'https://unpkg.com/three@0.155.0/build/three.min.js';
            script.onload = () => {
                console.log('✅ Three.js caricato da unpkg');
                loadParticleSystem();
            };
            script.onerror = () => {
                console.warn('❌ Errore caricamento Three.js da unpkg, provo jsDelivr...');
                tryJsDelivrCDN();
            };
            document.head.appendChild(script);
        }
        
        function tryJsDelivrCDN() {
            const script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js';
            script.onload = () => {
                console.log('✅ Three.js caricato da jsDelivr');
                loadParticleSystem();
            };
            script.onerror = () => {
                console.error('❌ Tutti i CDN falliti, creo Three.js mock per debug');
                createThreeMock();
            };
            document.head.appendChild(script);
        }
        
        function createThreeMock() {
            // Crea un Three.js minimale per debug
            window.THREE = {
                Scene: function() { this.children = []; this.add = function(obj) { this.children.push(obj); }; },
                PerspectiveCamera: function() { this.position = {x:0,y:0,z:0}; this.lookAt = function() {}; this.updateProjectionMatrix = function() {}; },
                WebGLRenderer: function() { 
                    this.setSize = function() {}; 
                    this.setPixelRatio = function() {}; 
                    this.render = function() {}; 
                    this.info = {};
                },
                Color: function(r,g,b) { this.r=r||0; this.g=g||0; this.b=b||0; },
                AmbientLight: function() {},
                DirectionalLight: function() { this.position = {x:0,y:0,z:0}; },
                BoxGeometry: function() {},
                SphereGeometry: function() {},
                PlaneGeometry: function() {},
                MeshLambertMaterial: function() {},
                Mesh: function(geo, mat) { this.position = {x:0,y:0,z:0}; this.userData = {}; },
                GridHelper: function() { this.position = {x:0,y:0,z:0}; },
                AxesHelper: function() {},
                Vector3: function(x,y,z) { this.x=x||0; this.y=y||0; this.z=z||0; this.clone=function(){return new THREE.Vector3(this.x,this.y,this.z);}; },
                Vector2: function() {},
                Raycaster: function() { this.setFromCamera = function() {}; this.intersectObjects = function() { return []; }; },
                Spherical: function() { this.setFromVector3 = function() {}; this.theta=0; this.phi=0; this.radius=1; }
            };
            console.warn('⚠️ Usando Three.js MOCK - solo per debug, nessun rendering reale');
            document.getElementById('stats').innerHTML = '⚠️ Three.js MOCK attivo - solo debug';
            loadParticleSystem();
        }
        
        function loadParticleSystem() {
            const script = document.createElement('script');
            script.src = 'js/core/ParticleSystem.js';
            script.onload = () => {
                console.log('✅ ParticleSystem caricato');
                init();
            };
            script.onerror = () => {
                console.error('❌ Errore caricamento ParticleSystem');
                document.getElementById('stats').innerHTML = '❌ ParticleSystem non caricato';
            };
            document.head.appendChild(script);
        }
        
        // Inizializzazione
        function init() {
            console.log('🚀 Inizializzazione test semplificato...');
            
            // Setup canvas
            canvas = document.getElementById('canvas3d');
            
            // Setup Three.js
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);
            
            // Camera
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(75, aspect, 0.1, 1000);
            camera.position.set(4, 2, 4);
            camera.lookAt(0, 0.5, 0);
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ 
                canvas: canvas,
                antialias: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            
            // Luci più intense
            const ambientLight = new THREE.AmbientLight(0x404040, 1.0);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
            directionalLight.position.set(10, 10, 10);
            directionalLight.castShadow = false;
            scene.add(directionalLight);
            
            // Luce aggiuntiva per vedere meglio gli oggetti
            const additionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            additionalLight.position.set(-10, 5, -10);
            scene.add(additionalLight);
            
            // Aggiungi modelli di test
            addTestModels();
            
            // Inizializza sistema particellare
            if (window.ParticleSystem) {
                particleSystem = window.ParticleSystem.init(scene, camera);
                console.log('✅ ParticleSystem inizializzato');
            } else {
                console.error('❌ ParticleSystem non trovato');
                document.getElementById('stats').innerHTML = '❌ ParticleSystem non caricato';
                return;
            }
            
            // Setup controlli
            setupControls();
            
            // Avvia render loop
            animate();
            
            // Aggiorna statistiche
            setInterval(updateStats, 500);
            
            // Debug finale
            console.log('✅ Inizializzazione completata');
            console.log('📊 Debug scena:');
            console.log('  - Oggetti in scena:', scene.children.length);
            console.log('  - Modelli da cliccare:', models.length);
            console.log('  - Camera position:', camera.position);
            console.log('  - Camera target:', new THREE.Vector3(0, 0.5, 0));
            
            // Test rendering
            setTimeout(() => {
                console.log('🖼️ Primo render completato');
                console.log('  - Canvas size:', canvas.width, 'x', canvas.height);
                console.log('  - Renderer info:', renderer.info);
            }, 100);
        }
        
        function addTestModels() {
            // Cubo verde - più grande e visibile
            const cubeGeometry = new THREE.BoxGeometry(1.2, 1.2, 1.2);
            const cubeMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x4CAF50,
                emissive: 0x002200
            });
            const cube = new THREE.Mesh(cubeGeometry, cubeMaterial);
            cube.position.set(-1.5, 0.6, 0);
            cube.userData.name = 'cubo';
            scene.add(cube);
            models.push(cube);
            
            // Sfera blu - più grande e visibile  
            const sphereGeometry = new THREE.SphereGeometry(0.9, 32, 32);
            const sphereMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x2196F3,
                emissive: 0x000022
            });
            const sphere = new THREE.Mesh(sphereGeometry, sphereMaterial);
            sphere.position.set(1.5, 0.9, 0);
            sphere.userData.name = 'sfera';
            scene.add(sphere);
            models.push(sphere);
            
            // Piano più visibile
            const planeGeometry = new THREE.PlaneGeometry(8, 8);
            const planeMaterial = new THREE.MeshLambertMaterial({ 
                color: 0x888888, 
                side: THREE.DoubleSide,
                emissive: 0x111111
            });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -0.1;
            plane.userData.name = 'piano';
            scene.add(plane);
            models.push(plane);
            
            // Aggiungi griglia di riferimento per debug
            const gridHelper = new THREE.GridHelper(8, 16, 0x444444, 0x444444);
            gridHelper.position.y = 0;
            scene.add(gridHelper);
            
            // Aggiungi assi di riferimento per debug
            const axesHelper = new THREE.AxesHelper(2);
            scene.add(axesHelper);
            
            console.log('📦 Modelli aggiunti:', models.length);
            console.log('📦 Posizioni:');
            console.log('  - Cubo verde:', cube.position);
            console.log('  - Sfera blu:', sphere.position);
            console.log('  - Piano grigio:', plane.position);
        }
        
        function setupControls() {
            let mouseDown = false;
            let mouseX = 0, mouseY = 0;
            
            canvas.addEventListener('mousedown', (event) => {
                mouseDown = true;
                mouseX = event.clientX;
                mouseY = event.clientY;
            });
            
            canvas.addEventListener('mouseup', (event) => {
                if (mouseDown) {
                    const deltaX = Math.abs(event.clientX - mouseX);
                    const deltaY = Math.abs(event.clientY - mouseY);
                    
                    // Se movimento minimo = click
                    if (deltaX < 5 && deltaY < 5) {
                        handleClick(event);
                    }
                }
                mouseDown = false;
            });
            
            canvas.addEventListener('mousemove', (event) => {
                if (mouseDown) {
                    const deltaX = (event.clientX - mouseX) * 0.01;
                    const deltaY = (event.clientY - mouseY) * 0.01;
                    
                    // Rotazione camera semplice
                    const spherical = new THREE.Spherical();
                    spherical.setFromVector3(camera.position);
                    spherical.theta -= deltaX;
                    spherical.phi += deltaY;
                    spherical.phi = Math.max(0.1, Math.min(Math.PI - 0.1, spherical.phi));
                    
                    camera.position.setFromSpherical(spherical);
                    camera.lookAt(0, 0, 0);
                    
                    mouseX = event.clientX;
                    mouseY = event.clientY;
                }
            });
        }
        
        function handleClick(event) {
            console.log('🖱️ Click rilevato, tool attivo:', activeTool);
            
            if (activeTool === 'aria') {
                // Raycasting
                const rect = canvas.getBoundingClientRect();
                const mouse = new THREE.Vector2();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                
                const raycaster = new THREE.Raycaster();
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(models, true);
                
                if (intersects.length > 0) {
                    const intersection = intersects[0];
                    const intersectPoint = intersection.point;
                    const normal = intersection.face ? intersection.face.normal.clone() : new THREE.Vector3(0, 1, 0);
                    
                    // Crea effetto particellare
                    const effectPosition = intersectPoint.clone().add(normal.multiplyScalar(0.05));
                    const jetDirection = normal.clone().normalize();
                    
                    console.log('💨 Creando getto aria in:', effectPosition);
                    
                    // Getto aria
                    particleSystem.createAirJet(effectPosition, jetDirection, {
                        particleCount: 400,
                        life: 1.5,
                        speed: { min: 10, max: 25 }
                    });
                    
                    // Polvere dopo delay
                    setTimeout(() => {
                        particleSystem.createDustEffect(intersectPoint, {
                            particleCount: 200,
                            life: 2.5
                        });
                    }, 150);
                    
                    console.log('✨ Effetto particellare creato!');
                } else {
                    console.log('❌ Nessun oggetto colpito');
                }
            } else {
                console.log('ℹ️ Tool Aria non attivo, click ignorato');
            }
        }
        
        function selectTool(toolName) {
            // Rimuovi active da tutti
            document.querySelectorAll('.tool-icon').forEach(el => {
                el.classList.remove('active');
            });
            
            // Attiva tool selezionato
            document.querySelector(`[data-tool="${toolName}"]`).classList.add('active');
            activeTool = toolName;
            
            console.log('🔧 Tool selezionato:', toolName);
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Aggiorna particelle
            if (particleSystem && particleSystem.isActive) {
                particleSystem.update(0.016);
            }
            
            renderer.render(scene, camera);
        }
        
        function updateStats() {
            if (particleSystem) {
                const stats = particleSystem.getStats();
                document.getElementById('stats').innerHTML = `
                    Sistema: ${stats.isActive ? '✅' : '❌'}<br>
                    Tool Attivo: ${activeTool || 'nessuno'}<br>
                    Effetti: ${stats.activeEffects}<br>
                    Particelle: ${stats.totalParticles}
                `;
            }
        }
        
        // Funzioni test globali
        window.testAirJet = function() {
            if (!particleSystem) return;
            
            const pos = new THREE.Vector3(0, 1, 0);
            const dir = new THREE.Vector3(1, 0.5, 0).normalize();
            
            particleSystem.createAirJet(pos, dir);
            console.log('🧪 Test getto aria eseguito');
        };
        
        window.clearEffects = function() {
            if (particleSystem) {
                particleSystem.clearAllEffects();
                console.log('🧹 Effetti puliti');
            }
        };
        
        // Gestione resize
        window.addEventListener('resize', () => {
            if (camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
        
        // Inizializza quando pronto
        window.addEventListener('load', loadThreeJS);
        
    </script>
</body>
</html>
