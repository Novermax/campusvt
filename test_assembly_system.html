<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assembly System Test Suite - Campus Virtual Training</title>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r155/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r155/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r155/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/20.0.0/tween.umd.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            overflow-x: hidden;
        }
        
        .container {
            display: flex;
            height: 100vh;
        }
        
        .sidebar {
            width: 350px;
            background: rgba(0,0,0,0.8);
            padding: 20px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            border-right: 2px solid rgba(255,255,255,0.1);
        }
        
        .main-content {
            flex: 1;
            position: relative;
        }
        
        #canvas-container {
            width: 100%;
            height: 100vh;
        }
        
        .test-section {
            margin-bottom: 30px;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .test-section h3 {
            color: #4CAF50;
            margin-bottom: 15px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #ccc;
            text-transform: uppercase;
        }
        
        .btn {
            width: 100%;
            padding: 10px 15px;
            margin-bottom: 8px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
        }
        
        .btn-secondary {
            background: linear-gradient(135deg, #2196F3, #1976D2);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f44336, #d32f2f);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        
        .btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        select {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #555;
            border-radius: 5px;
            background: rgba(255,255,255,0.1);
            color: white;
            font-size: 12px;
        }
        
        select option {
            background: #333;
            color: white;
        }
        
        .status-display {
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            line-height: 1.4;
            max-height: 200px;
            overflow-y: auto;
            border-left: 4px solid #4CAF50;
        }
        
        .status-display.error {
            border-left-color: #f44336;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-bottom: 15px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #45a049);
            width: 0%;
            transition: width 0.3s ease;
        }
        
        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0,0,0,0.8);
            padding: 15px;
            border-radius: 8px;
            min-width: 200px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .info-panel h4 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 14px;
        }
        
        .info-panel .stat {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 12px;
        }
        
        .info-panel .stat-value {
            color: #2196F3;
            font-weight: bold;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #4CAF50;
            animation: spin 1s ease-in-out infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .log-entry {
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .log-entry:last-child {
            border-bottom: none;
        }
        
        .log-entry.success { color: #4CAF50; }
        .log-entry.warning { color: #FF9800; }
        .log-entry.error { color: #f44336; }
        .log-entry.info { color: #2196F3; }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h2>🏗️ Assembly System Test</h2>
            
            <!-- Configuration Loading -->
            <div class="test-section">
                <h3>📋 Configuration Loading</h3>
                <div class="control-group">
                    <label>Select Assembly Configuration:</label>
                    <select id="configSelect">
                        <option value="">-- Select Config --</option>
                        <option value="assembly_configs/assemblaggio_semplice.json">Simple Assembly</option>
                        <option value="assembly_configs/pompa_becker_assemblaggio.json">Becker Pump</option>
                        <option value="assembly_configs/assemblaggio_intercambiabile.json">Interchangeable Demo</option>
                    </select>
                </div>
                <button class="btn btn-primary" onclick="loadSelectedConfig()">Load Configuration</button>
                <button class="btn btn-secondary" onclick="showCurrentConfig()">Show Current Config</button>
            </div>
            
            <!-- Assembly Control -->
            <div class="test-section">
                <h3>🔧 Assembly Control</h3>
                <button class="btn btn-primary" onclick="enableAssemblyMode()">Enable Assembly Mode</button>
                <button class="btn btn-warning" onclick="disableAssemblyMode()">Disable Assembly Mode</button>
                <div class="control-group">
                    <label>Current Step:</label>
                    <select id="stepSelect">
                        <option value="">-- No Steps --</option>
                    </select>
                </div>
                <button class="btn btn-secondary" onclick="setAssemblyStep()">Set Step</button>
                <div class="progress-bar">
                    <div class="progress-fill" id="assemblyProgress"></div>
                </div>
            </div>
            
            <!-- Component Testing -->
            <div class="test-section">
                <h3>🧩 Component Testing</h3>
                <div class="control-group">
                    <label>Component:</label>
                    <select id="componentSelect">
                        <option value="">-- No Components --</option>
                    </select>
                </div>
                <button class="btn btn-secondary" onclick="testComponentMountable()">Check Mountable</button>
                <button class="btn btn-secondary" onclick="showSnapPoints()">Show Snap Points</button>
                <button class="btn btn-secondary" onclick="highlightComponent()">Highlight Component</button>
            </div>
            
            <!-- Undo/Redo -->
            <div class="test-section">
                <h3>↩️ Undo/Redo</h3>
                <button class="btn btn-warning" onclick="undoAssembly()">Undo</button>
                <button class="btn btn-warning" onclick="redoAssembly()">Redo</button>
                <button class="btn btn-danger" onclick="resetAssembly()">Reset All</button>
            </div>
            
            <!-- Validation -->
            <div class="test-section">
                <h3>✅ Validation</h3>
                <button class="btn btn-secondary" onclick="validateSequence()">Validate Sequence</button>
                <button class="btn btn-secondary" onclick="checkAssemblyStatus()">Check Status</button>
            </div>
            
            <!-- System Status -->
            <div class="test-section">
                <h3>📊 System Status</h3>
                <div class="status-display" id="statusLog">
                    <div class="loading">Initializing...</div>
                </div>
            </div>
        </div>
        
        <div class="main-content">
            <div id="canvas-container"></div>
            
            <!-- Info Panel -->
            <div class="info-panel" id="infoPanel">
                <h4>Assembly Status</h4>
                <div class="stat">
                    <span>Mode:</span>
                    <span class="stat-value" id="modeStatus">Disabled</span>
                </div>
                <div class="stat">
                    <span>Current Step:</span>
                    <span class="stat-value" id="currentStepStatus">-</span>
                </div>
                <div class="stat">
                    <span>Progress:</span>
                    <span class="stat-value" id="progressStatus">0%</span>
                </div>
                <div class="stat">
                    <span>Mounted:</span>
                    <span class="stat-value" id="mountedCount">0</span>
                </div>
                <div class="stat">
                    <span>Available:</span>
                    <span class="stat-value" id="availableCount">0</span>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Core Scripts -->
    <script src="js/config.js"></script>
    <script src="js/scene3d-modular.js"></script>
    <script src="js/modelloader.js"></script>
    <script src="js/core/DragDropSystem.js"></script>
    <script src="js/core/AssemblySystem.js"></script>
    <script src="js/core/AssemblyConfigParser.js"></script>
    
    <script>
        // Global state
        let scene3D = null;
        let currentConfig = null;
        let logEntries = [];
        
        // Initialize application
        async function initApplication() {
            try {
                log('🚀 Initializing Assembly System Test Suite...', 'info');
                
                // Initialize Scene3D
                if (!window.Scene3D) {
                    throw new Error('Scene3D not available');
                }
                
                scene3D = window.Scene3D;
                await scene3D.init();
                
                // Initialize DragDrop System
                if (!window.DragDropSystem.init(scene3D)) {
                    throw new Error('Failed to initialize DragDropSystem');
                }
                
                // Initialize Assembly System  
                if (!window.AssemblySystem.init(scene3D)) {
                    throw new Error('Failed to initialize AssemblySystem');
                }
                
                log('✅ All systems initialized successfully', 'success');
                
                // Load some basic models for testing
                await loadTestModels();
                
                updateInfoPanel();
                
            } catch (error) {
                log(`❌ Initialization failed: ${error.message}`, 'error');
                console.error('Initialization error:', error);
            }
        }
        
        // Load test models
        async function loadTestModels() {
            try {
                log('📦 Loading test models...', 'info');
                
                // Simulate loading some basic models
                // In real implementation, this would load actual 3D models
                const testModels = [
                    { name: 'base', position: [0, 0, 0] },
                    { name: 'filtro', position: [1, 0, 0] },
                    { name: 'coperchio', position: [-1, 0, 0] }
                ];
                
                testModels.forEach(modelData => {
                    // Create simple colored cubes as test models
                    const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2);
                    const material = new THREE.MeshLambertMaterial({ 
                        color: Math.random() * 0xffffff 
                    });
                    const mesh = new THREE.Mesh(geometry, material);
                    mesh.position.set(...modelData.position);
                    mesh.name = modelData.name;
                    
                    scene3D.scene.add(mesh);
                    scene3D.loadedModels = scene3D.loadedModels || [];
                    scene3D.loadedModels.push(mesh);
                });
                
                log(`✅ Loaded ${testModels.length} test models`, 'success');
                
            } catch (error) {
                log(`❌ Model loading failed: ${error.message}`, 'error');
            }
        }
        
        // Configuration functions
        async function loadSelectedConfig() {
            const configSelect = document.getElementById('configSelect');
            const configPath = configSelect.value;
            
            if (!configPath) {
                log('⚠️ No configuration selected', 'warning');
                return;
            }
            
            try {
                log(`📋 Loading configuration: ${configPath}`, 'info');
                
                currentConfig = await window.AssemblyConfigParser.loadAssemblyConfig(configPath);
                
                // Update UI
                updateStepSelect();
                updateComponentSelect();
                
                log(`✅ Configuration loaded: ${currentConfig.sequence.length} steps`, 'success');
                
            } catch (error) {
                log(`❌ Configuration loading failed: ${error.message}`, 'error');
                console.error('Config loading error:', error);
            }
        }
        
        function showCurrentConfig() {
            if (!currentConfig) {
                log('⚠️ No configuration loaded', 'warning');
                return;
            }
            
            log('📋 Current Configuration:', 'info');
            log(`- Sequence: [${currentConfig.sequence.join(', ')}]`, 'info');
            log(`- Components: ${Object.keys(currentConfig.snapPoints).length}`, 'info');
            log(`- Nodes: ${Object.keys(currentConfig.interchangeableNodes || {}).length}`, 'info');
        }
        
        // Assembly control functions
        function enableAssemblyMode() {
            if (!currentConfig) {
                log('❌ No configuration loaded', 'error');
                return;
            }
            
            try {
                const result = window.DragDropSystem.enableAssemblyMode(currentConfig);
                
                if (result) {
                    log('✅ Assembly mode enabled', 'success');
                } else {
                    log('❌ Failed to enable assembly mode', 'error');
                }
                
                updateInfoPanel();
                
            } catch (error) {
                log(`❌ Assembly mode error: ${error.message}`, 'error');
            }
        }
        
        function disableAssemblyMode() {
            try {
                window.DragDropSystem.disableAssemblyMode();
                log('🔴 Assembly mode disabled', 'warning');
                updateInfoPanel();
            } catch (error) {
                log(`❌ Disable error: ${error.message}`, 'error');
            }
        }
        
        function setAssemblyStep() {
            const stepSelect = document.getElementById('stepSelect');
            const stepIndex = parseInt(stepSelect.value);
            
            if (isNaN(stepIndex)) {
                log('⚠️ No step selected', 'warning');
                return;
            }
            
            try {
                const result = window.DragDropSystem.setCurrentAssemblyStep(stepIndex);
                
                if (result) {
                    log(`✅ Step set to: ${stepIndex}`, 'success');
                } else {
                    log(`❌ Failed to set step: ${stepIndex}`, 'error');
                }
                
                updateInfoPanel();
                
            } catch (error) {
                log(`❌ Step setting error: ${error.message}`, 'error');
            }
        }
        
        // Component testing functions
        function testComponentMountable() {
            const componentSelect = document.getElementById('componentSelect');
            const componentName = componentSelect.value;
            
            if (!componentName) {
                log('⚠️ No component selected', 'warning');
                return;
            }
            
            try {
                const isMountable = window.DragDropSystem.isComponentMountable(componentName);
                
                if (isMountable) {
                    log(`✅ Component '${componentName}' is mountable`, 'success');
                } else {
                    log(`❌ Component '${componentName}' is NOT mountable`, 'warning');
                }
                
            } catch (error) {
                log(`❌ Mountable test error: ${error.message}`, 'error');
            }
        }
        
        function showSnapPoints() {
            const componentSelect = document.getElementById('componentSelect');
            const componentName = componentSelect.value;
            
            if (!componentName) {
                log('⚠️ No component selected', 'warning');
                return;
            }
            
            try {
                const snapPoints = window.DragDropSystem.getAvailableSnapPoints(componentName);
                
                log(`📍 Snap points for '${componentName}':`, 'info');
                snapPoints.forEach((point, index) => {
                    log(`  ${index + 1}. ${point.id} at [${point.position.join(', ')}]`, 'info');
                });
                
                if (snapPoints.length === 0) {
                    log('  No snap points available', 'warning');
                }
                
            } catch (error) {
                log(`❌ Snap points error: ${error.message}`, 'error');
            }
        }
        
        function highlightComponent() {
            const componentSelect = document.getElementById('componentSelect');
            const componentName = componentSelect.value;
            
            if (!componentName) {
                log('⚠️ No component selected', 'warning');
                return;
            }
            
            // Find and highlight component in 3D scene
            const component = scene3D.loadedModels?.find(model => 
                model.name.toLowerCase() === componentName.toLowerCase()
            );
            
            if (component) {
                // Simple highlight by changing color temporarily
                const originalColor = component.material.color.getHex();
                component.material.color.setHex(0x00ff00);
                
                setTimeout(() => {
                    component.material.color.setHex(originalColor);
                }, 2000);
                
                log(`✨ Highlighted component '${componentName}'`, 'success');
            } else {
                log(`❌ Component '${componentName}' not found in scene`, 'error');
            }
        }
        
        // Undo/Redo functions
        function undoAssembly() {
            try {
                const result = window.DragDropSystem.undoAssembly();
                
                if (result) {
                    log('↩️ Undo successful', 'success');
                } else {
                    log('⚠️ Nothing to undo', 'warning');
                }
                
                updateInfoPanel();
                
            } catch (error) {
                log(`❌ Undo error: ${error.message}`, 'error');
            }
        }
        
        function redoAssembly() {
            try {
                const result = window.DragDropSystem.redoAssembly();
                
                if (result) {
                    log('↪️ Redo successful', 'success');
                } else {
                    log('⚠️ Nothing to redo', 'warning');
                }
                
                updateInfoPanel();
                
            } catch (error) {
                log(`❌ Redo error: ${error.message}`, 'error');
            }
        }
        
        function resetAssembly() {
            if (confirm('Are you sure you want to reset the entire assembly?')) {
                try {
                    window.AssemblySystem.reset();
                    log('🔄 Assembly reset complete', 'warning');
                    updateInfoPanel();
                } catch (error) {
                    log(`❌ Reset error: ${error.message}`, 'error');
                }
            }
        }
        
        // Validation functions
        function validateSequence() {
            try {
                const validation = window.DragDropSystem.validateAssemblySequence();
                
                if (validation.valid) {
                    log('✅ Sequence validation passed', 'success');
                } else {
                    log('❌ Sequence validation failed:', 'error');
                    validation.errors.forEach(error => {
                        log(`  - ${error}`, 'error');
                    });
                }
                
            } catch (error) {
                log(`❌ Validation error: ${error.message}`, 'error');
            }
        }
        
        function checkAssemblyStatus() {
            try {
                const status = window.DragDropSystem.getAssemblyStatus();
                
                log('📊 Assembly Status:', 'info');
                log(`  - Enabled: ${status.enabled}`, 'info');
                log(`  - Assembly Mode: ${status.assemblyMode}`, 'info');
                log(`  - Current Step: ${status.currentStep}/${status.totalSteps}`, 'info');
                log(`  - Mounted Components: ${status.mountedComponents.length}`, 'info');
                log(`  - Available Components: ${status.availableComponents.length}`, 'info');
                
            } catch (error) {
                log(`❌ Status check error: ${error.message}`, 'error');
            }
        }
        
        // UI update functions
        function updateStepSelect() {
            const stepSelect = document.getElementById('stepSelect');
            stepSelect.innerHTML = '<option value="">-- No Steps --</option>';
            
            if (currentConfig && currentConfig.sequence) {
                currentConfig.sequence.forEach((step, index) => {
                    const option = document.createElement('option');
                    option.value = index;
                    option.textContent = `${index}: ${step}`;
                    stepSelect.appendChild(option);
                });
            }
        }
        
        function updateComponentSelect() {
            const componentSelect = document.getElementById('componentSelect');
            componentSelect.innerHTML = '<option value="">-- No Components --</option>';
            
            if (currentConfig && currentConfig.snapPoints) {
                Object.keys(currentConfig.snapPoints).forEach(componentName => {
                    const option = document.createElement('option');
                    option.value = componentName;
                    option.textContent = componentName;
                    componentSelect.appendChild(option);
                });
            }
        }
        
        function updateInfoPanel() {
            try {
                const status = window.DragDropSystem.getAssemblyStatus();
                
                document.getElementById('modeStatus').textContent = 
                    status.assemblyMode ? 'Assembly' : 'Disabled';
                    
                document.getElementById('currentStepStatus').textContent = 
                    status.totalSteps > 0 ? `${status.currentStep}/${status.totalSteps}` : '-';
                    
                const progress = status.totalSteps > 0 ? 
                    Math.round((status.currentStep / status.totalSteps) * 100) : 0;
                document.getElementById('progressStatus').textContent = `${progress}%`;
                document.getElementById('assemblyProgress').style.width = `${progress}%`;
                
                document.getElementById('mountedCount').textContent = status.mountedComponents.length;
                document.getElementById('availableCount').textContent = status.availableComponents.length;
                
            } catch (error) {
                console.error('Info panel update error:', error);
            }
        }
        
        // Logging function
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const entry = {
                message,
                type,
                timestamp
            };
            
            logEntries.push(entry);
            
            // Keep only last 100 entries
            if (logEntries.length > 100) {
                logEntries = logEntries.slice(-100);
            }
            
            // Update log display
            const statusLog = document.getElementById('statusLog');
            statusLog.innerHTML = logEntries.map(entry => 
                `<div class="log-entry ${entry.type}">
                    [${entry.timestamp}] ${entry.message}
                </div>`
            ).join('');
            
            // Scroll to bottom
            statusLog.scrollTop = statusLog.scrollHeight;
        }
        
        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', initApplication);
        
        // Auto-update info panel every 2 seconds
        setInterval(updateInfoPanel, 2000);
    </script>
</body>
</html>
