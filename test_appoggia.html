<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Azione Appoggia</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: white;
            font-family: Arial, sans-serif;
        }
        #canvas3d {
            width: 800px;
            height: 600px;
            border: 2px solid #333;
            display: block;
            margin: 20px auto;
        }
        .controls {
            text-align: center;
            margin: 20px;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #45a049;
        }
        .info {
            text-align: center;
            margin: 20px;
            padding: 15px;
            background: #333;
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <h1>Test Azione Appoggia - Sistema 3D</h1>
    
    <div class="info">
        <p><strong>Test della nuova azione "appoggia"</strong></p>
        <p>Questa pagina testa la funzionalità che appoggia automaticamente gli oggetti al pavimento (Y=0)</p>
        <p>Sintassi: <code>Azione1=appoggia(durata)</code></p>
    </div>

    <canvas id="canvas3d"></canvas>
    
    <div class="controls">
        <button onclick="testAppoggia()">Test Appoggia Filtro</button>
        <button onclick="resetScene()">Reset Scena</button>
        <button onclick="showBoundingBox()">Mostra Bounding Box</button>
    </div>

    <!-- Caricamento Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r155/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.155.0/examples/js/loaders/GLTFLoader.js"></script>
    
    <!-- Sistema 3D -->
    <script src="js/config.js?nocache=999999"></script>
    <script src="js/scene3d-modular.js?nocache=1000010"></script>
    <script src="js/modelloader.js?nocache=1000011"></script>
    <script src="js/ui.js?nocache=1000006"></script>

    <script>
        let filtroModel = null;
        
        // Inizializza la scena 3D
        function initTestScene() {
            if (!window.Scene3D) {
                console.error('Scene3D not loaded');
                return;
            }
            
            Scene3D.init();
            
            // Carica solo il filtro per il test
            const loader = new THREE.GLTFLoader();
            loader.load('models/filtro.glb', (gltf) => {
                filtroModel = gltf.scene;
                filtroModel.userData.originalFilename = 'filtro';
                
                // Posiziona il filtro in alto per testare l'appoggiamento
                filtroModel.position.set(0, 2, 0);
                
                Scene3D.scene.add(filtroModel);
                Scene3D.loadedModels.push(filtroModel);
                
                console.log('Filtro caricato e posizionato a Y=2 per test');
                showBoundingBox();
            });
        }
        
        // Test dell'azione appoggia
        function testAppoggia() {
            if (!filtroModel) {
                alert('Carica prima il modello!');
                return;
            }
            
            console.log('Posizione iniziale filtro:', filtroModel.position.y);
            
            // Simula un movimento step con azione appoggia
            const tutorialStep = "appoggia(2.0)";
            const movementSteps = Scene3D.parseMovementSteps(tutorialStep);
            
            if (movementSteps && movementSteps.length > 0) {
                Scene3D.startMultiStepMovement(filtroModel, movementSteps);
                console.log('Avviata animazione appoggia con durata 2 secondi');
            } else {
                console.error('Errore nel parsing del movimento appoggia');
            }
        }
        
        // Reset della scena
        function resetScene() {
            if (filtroModel) {
                filtroModel.position.set(0, 2, 0);
                console.log('Filtro riposizionato a Y=2');
                showBoundingBox();
            }
        }
        
        // Mostra informazioni bounding box
        function showBoundingBox() {
            if (!filtroModel) return;
            
            const boundingBox = new THREE.Box3().setFromObject(filtroModel);
            console.log('Bounding Box del filtro:', {
                min: boundingBox.min,
                max: boundingBox.max,
                size: boundingBox.getSize(new THREE.Vector3())
            });
            
            console.log('Posizione attuale:', filtroModel.position);
            console.log('Distanza min.y da Y=0:', boundingBox.min.y);
        }
        
        // Inizializza quando la pagina è caricata
        window.addEventListener('load', () => {
            setTimeout(initTestScene, 500);
        });
    </script>
</body>
</html>
